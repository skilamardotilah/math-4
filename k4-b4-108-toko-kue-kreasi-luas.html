</style><div class="app"><header><div><h1>🍰 Toko Kue: Kreasi Luas!</h1><small>Buat pesanan, lalu hias sesukamu.</small></div><div class="levels"><button onclick="start(1)">Level 1</button><button onclick="start(2)">Level 2</button><button onclick="start(3)">Level 3</button></div></header><h2 class="page-heading" id="page-heading">Bentuk Kue</h2><div class="order" id="order-panel"><span class="customer" id="customer">👩</span><p id="order"></p></div><div class="tools" id="tools"></div><div class="board"><canvas id="canvas" width="1000" height="340"></canvas><button id="review-order" class="review-order" onclick="receive()">Lihat Pesanan</button><button class="grid-button" id="grid-button" onclick="grid=!grid;ui()">Lihat Kotak Satuan</button></div><div class="hint" id="hint"></div><div class="actions" id="actions"></div><div class="message" id="message" aria-live="polite"></div><footer><div class="left-footer"><button onclick="menu()">Kembali ke Menu</button></div><div class="footer-status"><span id="progress"></span><span id="stats" class="stats"></span></div><div id="footer-action"></div></footer></div><div class="modal" id="modal"><div class="card" id="card"></div></div><script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let level=1,q=0,points=0,hearts=3,phase='shape',tool='roll',cakes=[],active=false,grid=false,held=false,pointer=null,travel=0,selected=[],gallery=[],drag=null,cream='#fff2cf';const fruitNames=['Stroberi','Bluberi','Kiwi','Jeruk','Cokelat'];const fruitIcons=['🍓','🫐','🥝','🍊','🍫'];let topping=0;
const orders=[['gt','lt','eq','gt','lt'],['eq','gt','lt','eq','gt'],['ABC','CAB','BCA','ACB','CBA']];const customers=['👩','👨','👧','🧕','👴'];
function sound(f){try{let a=sound.a||(sound.a=new(window.AudioContext||window.webkitAudioContext)()),o=a.createOscillator(),v=a.createGain();o.connect(v);v.connect(a.destination);o.frequency.value=f;v.gain.setValueAtTime(.05,a.currentTime);v.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15);o.start();o.stop(a.currentTime+.15)}catch(e){}}
function menu(){active=false;held=false;drag=null;$('modal').classList.remove('hidden');$('card').innerHTML='<div style="font-size:55px">🧁👩‍🍳🍓</div><h2>Toko Kue: Kreasi Luas!</h2><p>Pelanggan memesan kue dengan luas tertentu.<br>Gilas untuk memperbesar, potong untuk memperkecil.<br>Jika pesanan benar, pilih krim dan topping buah!</p><p>1 · Dua kue dengan bentuk sama<br>2 · Dua kue dengan bentuk berbeda<br>3 · Tiga kue dan urutan luas</p><button onclick="start(1)">Buka Toko!</button>'}
function start(l){level=l;q=0;points=0;hearts=3;gallery=[];active=true;$('modal').classList.add('hidden');load();receive()}
function receive(){active=false;held=false;drag=null;pointer=null;$('modal').classList.remove('hidden');$('card').innerHTML='<div style="font-size:65px">'+customers[q]+'</div><h2>Pesanan Pelanggan</h2><p style="font-size:21px;background:#fff0cd;padding:18px;border-radius:16px">“'+orderText()+'”</p><p>Pesanan '+(q+1)+' dari 5</p><button onclick="acceptOrder()">'+(phase==='sort'?'Kembali Mengurutkan →':'Mulai Membuat Kue →')+'</button>'}
function acceptOrder(){active=true;$('modal').classList.add('hidden');ui()}
function makeCells(kind,n){let cells=[];if(kind==='rect'){for(let y=0;y<2;y++)for(let x=0;x<n;x++)cells.push([x,y])}else if(kind==='tall'){for(let y=0;y<n;y++)for(let x=0;x<2;x++)cells.push([x,y])}else{for(let y=0;y<2;y++)for(let x=0;x<n;x++)cells.push([x,y]);for(let y=2;y<4;y++)for(let x=0;x<2;x++)cells.push([x,y])}return cells}
function load(){phase='shape';tool='roll';grid=false;held=false;pointer=null;drag=null;travel=0;selected=[];cream='#fff2cf';topping=0;let kinds=level===1?['rect','rect']:level===2?['rect',q%2?'tall':'L']:['rect','tall','L'];cakes=kinds.map((kind,i)=>({label:'ABC'[i],kind,n:3,cream:null,tops:[],cx:kinds.length===3?190+i*310:280+i*440}));$('message').textContent='';ui()}
function area(c){return makeCells(c.kind,c.n).length}
function relation(){let r=orders[level-1][q];return r==='gt'?'lebih luas daripada':r==='lt'?'lebih sempit daripada':'sama luas dengan'}
function orderText(){if(level<3)return 'Saya pesan dua kue. Buat kue A '+relation()+' kue B.';let a=orders[2][q].split('');return 'Saya pesan tiga kue. Kue '+a[1]+' lebih luas dari kue '+a[0]+', dan kue '+a[2]+' paling luas.'}
function button(container,label,fn,selected=false,disabled=false){let b=document.createElement('button');b.textContent=label;b.onclick=fn;b.disabled=disabled;b.classList.toggle('active',selected);$(container).append(b)}
function ui(){document.querySelectorAll('.levels button').forEach((b,i)=>b.classList.toggle('active',i===level-1));$('customer').textContent=customers[q];$('order-panel').classList.add('hidden');$('page-heading').textContent=phase==='decorate'?'Hias Kue':phase==='sort'?'Urutkan Kue':level<3?'Bentuk Kue · A '+relation()+' B':'Bentuk Kue · '+orders[2][q].split('').join(' < ');$('tools').innerHTML='';$('actions').innerHTML='';$('footer-action').innerHTML='';$('grid-button').classList.toggle('hidden',phase==='decorate');$('review-order').classList.toggle('hidden',phase==='decorate');$('grid-button').textContent=grid?'Sembunyikan Kotak Satuan':'Lihat Kotak Satuan';if(phase==='shape'){button('actions','🪵 Gilas',()=>{tool='roll';ui()},tool==='roll');button('actions','🔪 Potong',()=>{tool='cut';ui()},tool==='cut');button('footer-action','Periksa Pesanan →',check);$('hint').textContent='Geser penggilas untuk memperbesar, pisau untuk memperkecil.'}else if(phase==='sort'){cakes.forEach(c=>button('actions',selected.includes(c.label)?selected.indexOf(c.label)+1+' · '+c.label:c.label,()=>{selected.push(c.label);if(selected.length===3)checkSort();else ui()},false,selected.includes(c.label)));button('actions','Ulang Urutan',()=>{selected=[];ui()});$('hint').textContent='Pilih huruf kue dari paling sempit ke paling luas.'}else{button('tools','Krim Vanila',()=>{cream='#fff2cf';tool='cream';ui()},tool==='cream'&&cream==='#fff2cf');button('tools','Krim Cokelat',()=>{cream='#80513e';tool='cream';ui()},tool==='cream'&&cream==='#80513e');fruitNames.forEach((n,i)=>button('tools',fruitIcons[i]+' '+n,()=>{topping=i;tool='fruit';ui()},tool==='fruit'&&topping===i));button('footer-action','Selesai Menghias →',deliver);button('actions','Hapus Hiasan',()=>{cakes.forEach(c=>{c.tops=[];c.cream=null});$('message').textContent='Kue siap dihias kembali.'});$('hint').textContent=tool==='cream'?'Usapkan krim di atas kue.':'Seret buah dari mangkuk ke kue. Boleh mencampur topping!'}$('progress').textContent='Pesanan '+(q+1)+' / 5';$('stats').textContent='♥'.repeat(hearts)+'♡'.repeat(3-hearts)+' · '+points+' poin'}
function wrong(text){hearts--;$('message').textContent=text;sound(220);if(hearts===0){finish(false);return}ui()}
function check(){if(!active||phase!=='shape')return;let good;if(level<3){let d=area(cakes[0])-area(cakes[1]),r=orders[level-1][q];good=r==='gt'?d>0:r==='lt'?d<0:d===0}else{let a=orders[2][q].split('').map(l=>cakes.find(c=>c.label===l));good=area(a[0])<area(a[1])&&area(a[1])<area(a[2])}if(!good){wrong('Belum sesuai. Ubah ukuran kuenya, lalu periksa lagi.');return}if(level===3){phase='sort';selected=[];$('message').textContent='Ukuran tepat! Sekarang urutkan kuenya.';sound(650);ui()}else unlock()}
function checkSort(){let actual=[...cakes].sort((a,b)=>area(a)-area(b)).map(c=>c.label).join('');if(selected.join('')===actual)unlock();else{selected=[];wrong('Urutannya belum tepat. Mulai dari kue paling sempit.')}}
function unlock(){phase='decorate';points+=20;grid=false;tool='fruit';topping=0;$('message').textContent='Pesanan benar! Pilih krim dan topping favoritmu.';sound(900);ui()}
function deliver(){if(!active||phase!=='decorate')return;gallery.push(cakes.some(c=>c.tops.length)?fruitIcons[topping]:'🍰');held=false;drag=null;pointer=null;active=false;$('modal').classList.remove('hidden');$('card').innerHTML='<div style="font-size:55px">'+customers[q]+' 🍰</div><h2>Terima kasih!</h2><p>Kue sudah sesuai pesanan.<br>'+cakes.map(c=>c.label+' = '+area(c)+' kotak satuan').join(' · ')+'</p><button onclick="next()">'+(q===4?'Lihat Hasil':'Pelanggan Berikutnya →')+'</button>';ui()}

function finish(win){active=false;held=false;drag=null;$('modal').classList.remove('hidden');$('card').innerHTML='<div style="font-size:55px">👩‍🍳🍰⭐</div><h2>'+(win?'Toko kue sukses!':'Coba lagi, yuk!')+'</h2><p>'+gallery.length+' pesanan selesai · '+points+' poin<br>Luas adalah besar permukaan kue.<br>Bentuk berbeda bisa sama luas.</p><button onclick="start('+level+')">Main Lagi</button> '+(win&&level<3?'<button onclick="start('+(level+1)+')">Level Berikutnya</button>':'')+'<p><button onclick="menu()">Menu</button></p>'}
function layout(c){let cells=makeCells(c.kind,c.n),w=(Math.max(...cells.map(t=>t[0]))+1)*28,h=(Math.max(...cells.map(t=>t[1]))+1)*28;return{cells,x:c.cx-w/2,y:156-h/2,w,h}}
function hit(p){return cakes.find(c=>{let a=layout(c);return a.cells.some(([x,y])=>p.x>=a.x+x*28&&p.x<a.x+(x+1)*28&&p.y>=a.y+y*28&&p.y<a.y+(y+1)*28)})}
function position(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*1000/r.width,y:(e.clientY-r.top)*340/r.height}}
function resize(c){let next=c.n+(tool==='roll'?1:-1);if(next<2||next>6){$('message').textContent=next<2?'Kue sudah paling kecil.':'Kue sudah paling besar.';return}c.n=next;sound(tool==='roll'?500:350);$('message').textContent='Kue '+c.label+(tool==='roll'?' diperbesar.':' diperkecil.');}
canvas.onpointerdown=e=>{if(!active)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);held=true;pointer=position(e);travel=0;if(phase==='decorate'&&tool==='fruit'&&Math.hypot(pointer.x-500,pointer.y-294)<72)drag=topping;if(phase==='decorate'&&tool==='cream'){let c=hit(pointer);if(c)c.cream=cream}};

function round(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function fruit(i,x,y,size=1){ctx.save();ctx.translate(x,y);ctx.scale(size,size);if(i===0){ctx.fillStyle='#e84d5a';ctx.beginPath();ctx.moveTo(0,13);ctx.bezierCurveTo(-24,-6,-12,-18,0,-10);ctx.bezierCurveTo(12,-18,24,-6,0,13);ctx.fill();ctx.fillStyle='#fff5b1';for(let j=-1;j<=1;j++){ctx.beginPath();ctx.ellipse(j*5,0,1.2,2,0,0,7);ctx.fill()}ctx.fillStyle='#4b9e59';ctx.beginPath();ctx.moveTo(-9,-12);ctx.lineTo(0,-6);ctx.lineTo(9,-12);ctx.lineTo(0,-15);ctx.fill()}else if(i===1){for(let j=0;j<3;j++){ctx.fillStyle=['#536cba','#435ba2','#627bd0'][j];ctx.beginPath();ctx.arc((j-1)*7,j%2*8-4,8,0,7);ctx.fill();ctx.fillStyle='#bcc8f4';ctx.beginPath();ctx.arc((j-1)*7-2,j%2*8-6,2,0,7);ctx.fill()}}else if(i===2||i===3){ctx.fillStyle=i===2?'#91bc56':'#ffb347';ctx.beginPath();ctx.arc(0,0,13,0,7);ctx.fill();ctx.strokeStyle=i===2?'#527f37':'#fff2d2';ctx.lineWidth=2;for(let j=0;j<8;j++){let a=j*Math.PI/4;ctx.beginPath();ctx.moveTo(Math.cos(a)*4,Math.sin(a)*4);ctx.lineTo(Math.cos(a)*10,Math.sin(a)*10);ctx.stroke()}}else{round(-11,-10,22,20,3,'#67402f');ctx.strokeStyle='#a46e4f';ctx.lineWidth=2;ctx.strokeRect(-9,-8,8,7);ctx.strokeRect(1,1,8,7)}ctx.restore()}
function draw(){ctx.clearRect(0,0,1000,340);ctx.fillStyle='#e9c39e';ctx.fillRect(0,0,1000,340);ctx.strokeStyle='#d8ae88';for(let y=20;y<340;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1000,y);ctx.stroke()}cakes.forEach(c=>{round(c.cx-139,34,278,217,17,'#ad7655');round(c.cx-133,28,266,217,16,'#f7debd');ctx.fillStyle='#653d30';ctx.textAlign='center';ctx.font='bold 21px Trebuchet MS';ctx.fillText('Kue '+c.label,c.cx,52);let a=layout(c);a.cells.forEach(([x,y])=>{ctx.fillStyle='#b88449';ctx.fillRect(a.x+x*28,a.y+y*28+6,28,28);ctx.fillStyle=c.cream||'#edc47c';ctx.fillRect(a.x+x*28,a.y+y*28,28,28);if(grid){ctx.lineWidth=1;ctx.strokeStyle=c.cream?'#dcc69d':'#fff4d8';ctx.strokeRect(a.x+x*28,a.y+y*28,28,28)}});c.tops.forEach(t=>fruit(t.type,a.x+t.x,a.y+t.y,.8));ctx.fillStyle='#653d30';ctx.font='14px Trebuchet MS';ctx.fillText(grid?area(c)+' kotak satuan':phase==='decorate'?'Hias sesukamu!':'',c.cx,232)});if(phase==='decorate'&&tool==='fruit'){ctx.fillStyle='#d68b91';ctx.beginPath();ctx.ellipse(500,302,63,24,0,0,7);ctx.fill();ctx.fillStyle='#fff1e9';ctx.beginPath();ctx.ellipse(500,293,63,24,0,0,7);ctx.fill();fruit(topping,477,291);fruit(topping,510,288);fruit(topping,530,297);ctx.fillStyle='#653d30';ctx.font='13px Trebuchet MS';ctx.textAlign='center';ctx.fillText('Seret '+fruitNames[topping].toLowerCase()+' ke kue',500,334)}else if(phase==='shape'){ctx.font='14px Trebuchet MS';ctx.fillStyle='#653d30';ctx.textAlign='center';ctx.fillText(tool==='roll'?'🪵 Geser penggilas untuk memperbesar kue':'🔪 Geser pisau untuk memperkecil kue',500,305)}if(pointer&&active){if(phase==='shape'&&tool==='roll'){round(pointer.x-49,pointer.y-10,98,20,8,'#9d643b');round(pointer.x-30,pointer.y-17,60,34,9,'#dca567')}else if(phase==='shape'&&tool==='cut'){round(pointer.x-6,pointer.y-5,12,45,4,'#77533c');round(pointer.x-5,pointer.y-40,28,40,3,'#dbe7e9')}else if(drag!==null)fruit(drag,pointer.x,pointer.y);else if(phase==='decorate'&&tool==='cream'){round(pointer.x-5,pointer.y,10,45,4,'#865841');round(pointer.x-15,pointer.y-23,30,30,7,cream)}}requestAnimationFrame(draw)}
load();menu();requestAnimationFrame(draw);
