<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balap Perahu Pecahan</title>
<style>
:root{font-family:Nunito,system-ui,sans-serif;color:#183857;background:#dff5ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 15% 10%,#fff8 0 8%,transparent 8.2%),linear-gradient(#b6e9ff,#ecfbff)}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #e26e19;outline-offset:3px}.app{width:min(100%,1080px);background:#fff;border:3px solid #fff;border-radius:28px;box-shadow:0 20px 55px #17628b35;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:16px 22px;background:#1161a2;color:#fff}.top h1{font-size:clamp(1.18rem,3vw,1.8rem);margin:0}.top p{margin:3px 0 0;font-size:.87rem}.levels{display:flex;gap:7px}.levels button,.again{border:0;border-radius:12px;padding:9px 13px;background:#dff3ff;color:#164b77;font-weight:800}.levels button.current{background:#ffdb71;color:#563f0a}.levels button:disabled{opacity:.5;cursor:not-allowed}.content{padding:20px 24px 15px}.heading{text-align:center}.heading h2{margin:0 0 5px;font-size:clamp(1.12rem,3vw,1.55rem)}.heading p{margin:0 0 16px}.river{position:relative;height:190px;border-radius:20px;overflow:hidden;background:linear-gradient(#b9eaff 0 34%,#54c8e7 35%,#218dbf);border:3px solid #a3e1ed}.river:before{content:"";position:absolute;inset:45% 0 0;background:repeating-linear-gradient(170deg,transparent 0 32px,#d5f9ff55 34px 38px,transparent 40px 80px)}.finish{position:absolute;right:8%;top:35%;height:65%;border-left:5px dashed #fff;background:#ffffff22;padding:7px;font-weight:900;color:#103d5b}.boat{position:absolute;left:var(--position,4%);bottom:18px;transition:left .55s ease;font-size:64px;line-height:1;filter:drop-shadow(1px 6px 2px #065f8b60)}.river:after{content:"";position:absolute;top:50%;left:0;right:0;border-top:2px dashed #d8f8ff9c}.boat.player{bottom:8px}.boat.computer{top:48px;bottom:auto;font-size:57px;left:4%;transition:none}.boat.computer.racing{animation:computerRace var(--race-time,18s) linear forwards}.boat.computer.paused{animation-play-state:paused}@keyframes computerRace{from{left:4%}to{left:74%}}.lane-label{position:absolute;left:12px;z-index:2;font-size:.78rem;font-weight:900;color:#064866;background:#e5faffde;border-radius:7px;padding:2px 6px}.lane-label.computer-label{top:31px}.lane-label.player-label{bottom:58px}.shore{position:absolute;top:7%;left:15px;color:#225f69;font-weight:900}.work{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}.panel{border:2px solid #d4eaf4;border-radius:18px;padding:15px;background:#f6fcff;min-height:170px}.panel h3{font-size:1rem;margin:0 0 12px}.cards,.slots{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:9px;min-height:94px}.card{min-width:63px;min-height:76px;border:2px solid #68b4df;border-bottom:5px solid #3b91c5;background:#fff;border-radius:13px;display:grid;place-items:center;color:#173f69;font-weight:900;font-size:1.3rem;touch-action:manipulation}.card:hover{background:#fff6d9;transform:translateY(-2px)}.card:disabled{opacity:.35;transform:none;cursor:default}.fraction{display:inline-grid;vertical-align:middle;text-align:center;line-height:1.05;min-width:1.35em}.fraction span:first-child{border-bottom:2px solid currentColor;padding:0 4px 3px}.fraction span:last-child{padding-top:3px}.slot{min-width:57px;height:70px;border:2px dashed #9bc6dc;border-radius:12px;display:grid;place-items:center;background:#fff;color:#206399;font-size:1.25rem;font-weight:900}.slot.filled{border:2px solid #5fad85;background:#e5f8ed}.symbol{font-size:1.25rem;color:#287eae;font-weight:900}.message{min-height:31px;text-align:center;font-weight:850;margin:12px 0 4px;color:#126c50}.message.bad{color:#a54728}.footer{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 22px;background:#eaf8ff;font-weight:800}.again{background:#177db8;color:#fff}.note{text-align:center;font-size:.9rem;color:#3d637a;margin:10px 0 0}@media(max-width:700px){body{padding:12px}.top{flex-wrap:wrap;padding:14px}.levels{width:100%;justify-content:flex-end}.content{padding:15px}.river{height:175px}.boat{font-size:47px}.boat.computer{font-size:42px;top:55px}.lane-label.computer-label{top:39px}.lane-label.player-label{bottom:53px}.work{grid-template-columns:1fr;gap:10px}.panel{min-height:0;padding:12px}.cards,.slots{min-height:78px}.card{min-width:55px;min-height:67px}.slot{min-width:46px;height:60px}.footer{padding:12px 14px}}@media(prefers-reduced-motion:reduce){.boat{transition:none}}
</style></head><body><main class="app"><header class="top"><div><h1>⛵ Balap Perahu Pecahan</h1></div><nav class="levels" aria-label="Pilih level"><button data-level="0">Level 1</button><button data-level="1">Level 2</button><button data-level="2">Level 3</button></nav></header><div class="content"><div class="heading"><p>Ketuk pecahan dari <strong id="direction">terkecil ke terbesar</strong>.</p></div><div class="river" aria-label="Lintasan perahu"><div class="shore">MULAI</div><div class="finish">FINIS 🏁</div><span class="lane-label computer-label">Lawan</span><span class="lane-label player-label">Kamu</span><div class="boat computer" id="computer" aria-hidden="true">🚤</div><div class="boat player" id="boat" aria-hidden="true">⛵</div></div><div class="work"><section class="panel"><h3>Pilih pecahan</h3><div class="cards" id="cards"></div></section><section class="panel"><h3>Urutanmu</h3><div class="slots" id="slots"></div></section></div><p class="message" id="message" role="status" aria-live="polite"></p><p class="note">Penyebut sama? Bandingkan pembilangnya.</p></div><footer class="footer"><span id="progress"></span><span id="lives" aria-live="polite"></span><button class="again" id="again">Ulangi soal</button></footer></main>
<script>
(()=>{'use strict';
 const levels=[{count:3,rounds:4,denoms:[4,5,6,8]},{count:4,rounds:4,denoms:[5,6,8,10]},{count:5,rounds:4,denoms:[6,8,10,12]}];
 const $=id=>document.getElementById(id),buttons=[...document.querySelectorAll('[data-level]')];
 let level=0,round=0,selected=[],numbers=[],denom=4,finished=false,ascending=true,computerFinished=false,lives=3;
 const frac=n=>`<span class="fraction" aria-label="${n} per ${denom}"><span>${n}</span><span>${denom}</span></span>`;
 const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
 function setMessage(s,bad=false){$('message').textContent=s;$('message').classList.toggle('bad',bad)}
 function updateLives(){$('lives').textContent=`${'♥ '.repeat(lives)}${'♡ '.repeat(3-lives)}`;$('lives').setAttribute('aria-label',`${lives} hati tersisa dari 3`)}
 function newRound(){let cfg=levels[level];denom=cfg.denoms[round];ascending=round%2===0;numbers=shuffle(Array.from({length:denom-1},(_,i)=>i+1)).slice(0,cfg.count);selected=[];finished=false;computerFinished=false;const rival=$('computer');rival.classList.remove('racing','paused');rival.style.setProperty('--race-time','5s');void rival.offsetWidth;rival.classList.add('racing');$('boat').style.setProperty('--position','4%');$('direction').textContent=ascending?'terkecil ke terbesar':'terbesar ke terkecil';$('progress').textContent=`Soal ${round+1} dari ${cfg.rounds}`;updateLives();$('again').textContent='Ulangi soal';setMessage('Pilih pecahan pertama.');render()}
 function render(){let cards=$('cards'),slots=$('slots');cards.replaceChildren();slots.replaceChildren();numbers.forEach(n=>{let btn=document.createElement('button');btn.type='button';btn.className='card';btn.innerHTML=frac(n);btn.setAttribute('aria-label',`${n} per ${denom}`);btn.disabled=finished||selected.includes(n);btn.addEventListener('click',()=>choose(n));cards.append(btn)});for(let i=0;i<numbers.length;i++){if(i){let sign=document.createElement('span');sign.className='symbol';sign.textContent=ascending?'<':'>';slots.append(sign)}let slot=document.createElement('span');slot.className='slot'+(i<selected.length?' filled':'');if(i<selected.length)slot.innerHTML=frac(selected[i]);else slot.textContent='?';slots.append(slot)}}
 function choose(n){if(finished)return;const correct=[...numbers].sort((a,b)=>ascending?a-b:b-a)[selected.length];if(n!==correct){setMessage(`Belum tepat. Pilih pecahan paling ${ascending?'kecil':'besar'} yang tersisa.`,true);return}selected.push(n);$('boat').style.setProperty('--position',`${4+selected.length/numbers.length*70}%`);if(selected.length===numbers.length){finished=true;const rival=$('computer');if(!computerFinished)rival.classList.add('paused');setMessage(computerFinished?'Urutan benar! Lanjut ke soal berikutnya.':'Hebat! Perahumu lebih dulu sampai!');$('again').textContent=round===levels[level].rounds-1?(level===2?'Main lagi':'Level berikutnya'):'Soal berikutnya';if(round===levels[level].rounds-1&&level<2)buttons[level+1].disabled=false}else setMessage('Benar! Lanjutkan urutannya.');render()}
 function goLevel(i){level=i;round=0;buttons.forEach((b,k)=>b.classList.toggle('current',k===level));newRound()}
 $('computer').addEventListener('animationend',()=>{if(finished||computerFinished)return;computerFinished=true;lives--;updateLives();if(lives===0){finished=true;setMessage('Semua ♥ habis. Yuk, coba balapan lagi!',true);$('again').textContent='Main lagi';render()}else setMessage('Lawan sampai lebih dulu! Kamu kehilangan 1 ♥. Selesaikan urutanmu.',true)});buttons.forEach((b,i)=>b.addEventListener('click',()=>{if(lives>0)goLevel(i)}));$('again').addEventListener('click',()=>{if(lives===0){lives=3;goLevel(0);return}if(finished){if(round<levels[level].rounds-1){round++;newRound()}else if(level<2)goLevel(level+1);else goLevel(0)}else newRound()});goLevel(0);
})();
</script></body></html>
