const $=id=>document.getElementById(id),icons=['🍎','📚','🌼','🧁','⚽'];let level=0,chosen=0,started=false;
const sessions=[null,null,null];
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const themes=[
 {title:'Buku yang Dibaca',unit:'buku',axis:'Jumlah buku',labels:['Kelas A','Kelas B','Kelas C','Kelas D']},
 {title:'Olahraga Kesukaan',unit:'siswa',axis:'Jumlah siswa',labels:['Bola','Renang','Bulu tangkis','Basket']},
 {title:'Kendaraan yang Lewat',unit:'kendaraan',axis:'Jumlah kendaraan',labels:['Sepeda','Motor','Mobil','Bus']},
 {title:'Minuman Pilihan Siswa',unit:'siswa',axis:'Jumlah siswa',labels:['Susu','Jus','Air putih','Teh']},
 {title:'Bunga di Kebun',unit:'bunga',axis:'Jumlah bunga',labels:['Mawar','Melati','Anggrek','Tulip']}
];
function makeSession(l){const order=shuffle([...themes]);return {index:0,done:false,questions:order.map((theme,i)=>{const step=[1,2,5][l],base=l===0?[2,3,4,5]:[3,4,6,8];return {theme,step,values:shuffle([...base]).map(n=>n*step),ask:l===0?i%2:l===1?i%3:i%3+3,value:'',correct:false,wrong:false}})}}
function state(){return sessions[level]||(sessions[level]=makeSession(level))}function current(){return state().questions[state().index]}
function total(){return sessions.reduce((sum,s)=>sum+(s?s.questions.filter(q=>q.correct).length*20:0),0)}
function buttons(){for(const id of ['levelButtons','coverLevels']){$(id).innerHTML='';for(let i=0;i<3;i++){const b=document.createElement('button');b.innerHTML='Level '+(i+1)+(sessions[i]?.done?' ✓':'')+(id==='coverLevels'?'<small>'+['Mudah','Sedang','Sulit'][i]+'</small>':'');b.classList.toggle('active',i===(started?level:chosen));b.onclick=()=>{if(!started){chosen=i;buttons()}else{level=i;render()}};$(id).append(b)}if(id==='levelButtons'){const label=document.createElement('label');label.className='mobile-level-label';label.htmlFor='mobileLevel';label.textContent='Pilih Level';const select=document.createElement('select');select.id='mobileLevel';select.setAttribute('aria-label','Pilih level');for(let i=0;i<3;i++){const option=document.createElement('option');option.value=i;option.textContent='Level '+(i+1)+(sessions[i]?.done?' ✓':'');select.append(option)}select.value=started?level:chosen;select.onchange=()=>{if(started){level=Number(select.value);render()}else{chosen=Number(select.value);buttons()}};$(id).append(label,select)}}}

function answerFor(q){const v=q.values;if(q.ask===0)return v[0];if(q.ask===1)return q.theme.labels[v.indexOf(Math.max(...v))];if(q.ask===2)return q.theme.labels[v.indexOf(Math.min(...v))];if(q.ask===3)return v.reduce((a,b)=>a+b,0);if(q.ask===4)return Math.max(...v)-Math.min(...v);return v[0]+v[1]}
function questionText(q){const t=q.theme.labels;if(q.ask===0)return 'Berapa jumlah untuk '+t[0]+'?';if(q.ask===1)return 'Kategori mana yang paling banyak?';if(q.ask===2)return 'Kategori mana yang paling sedikit?';if(q.ask===3)return 'Berapa jumlah seluruhnya?';if(q.ask===4)return 'Berapa selisih jumlah terbanyak dan paling sedikit?';return 'Berapa jumlah '+t[0]+' dan '+t[1]+'?'}
function chartSvg(q){const W=600,H=355,left=64,top=32,bottom=72,plot=H-top-bottom,max=q.step*(level===0?6:10),colors=['#71bcb2','#efaa83','#91b4dc','#c4a2d2'];let svg='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+q.theme.title+'" xmlns="http://www.w3.org/2000/svg"><title>'+q.theme.title+'</title><desc>'+q.theme.labels.map((t,i)=>t+': '+q.values[i]).join('; ')+'</desc>';
svg+='<text x="64" y="20" font-size="17">'+q.theme.axis+'</text>';
for(let n=0;n<=max;n+=q.step){const y=top+plot*(1-n/max);svg+='<line x1="'+left+'" y1="'+y+'" x2="585" y2="'+y+'" stroke="'+(n===0?'#25485d':'#dce8e5')+'" stroke-width="'+(n===0?2:1)+'"/><text x="52" y="'+(y+6)+'" text-anchor="end" font-size="19">'+n+'</text>'}
svg+='<line x1="64" y1="32" x2="64" y2="'+(top+plot)+'" stroke="#25485d" stroke-width="2"/>';
q.values.forEach((v,i)=>{const x=84+i*124,h=v/max*plot,y=top+plot-h;svg+='<rect x="'+x+'" y="'+y+'" width="72" height="'+h+'" rx="5" fill="'+colors[i]+'" stroke="#25485d" stroke-width="1.5"/><text x="'+(x+36)+'" y="'+(top+plot+25)+'" text-anchor="middle" font-size="18">'+q.theme.labels[i]+'</text>'});return svg+'</svg>'}
function options(q){const right=answerFor(q);if(typeof right==='string')return shuffle([...q.theme.labels]);return shuffle([...new Set([right,Math.max(0,right-q.step),right+q.step,right+q.step*2])])}
function render(){buttons();const s=state(),q=current();$('activity').textContent=['Baca Jumlah','Bandingkan Jumlah','Total dan Selisih'][level];$('instruction').textContent='Perhatikan angka pada sumbu dan tinggi batang.';$('chartTitle').textContent=q.theme.title;$('chart').innerHTML=chartSvg(q);$('key').textContent='Setiap garis menunjukkan '+q.step+' '+q.theme.unit+'.';const actionBox=$('actions');actionBox.remove();$('task').innerHTML='<p class="question">'+questionText(q)+'</p><div class="answers" id="answers"></div><button class="check" id="check">Periksa Jawaban</button>';
if(!q.options)q.options=options(q);q.options.forEach(v=>{const b=document.createElement('button');b.textContent=v;b.className='choice'+(String(v)===q.value?' selected':'');b.disabled=q.correct;b.setAttribute('aria-pressed',String(v)===q.value?'true':'false');b.onclick=()=>{q.value=String(v);q.wrong=false;render()};$('answers').append(b)});
const fb=document.createElement('div');fb.className='feedback '+(q.correct?'good':q.wrong?'bad':'');fb.textContent=q.correct?'Benar! +20 poin.':q.wrong?'Belum tepat. Coba lihat diagram lagi.':'';$('task').append(fb);$('task').append(actionBox);$('check').hidden=q.correct;$('check').disabled=q.value==='';$('check').onclick=check;$('actions').innerHTML='';if(q.correct&&s.index<4)addAction('Berikutnya',()=>{s.index++;render()});if(s.index>0)addAction('Sebelumnya',()=>{s.index--;render()});if(s.done)addAction('Main Lagi',replay);$('progress').textContent='Soal '+(s.index+1)+' / 5';$('score').textContent='Skor '+total();}
function addAction(t,f){const b=document.createElement('button');b.textContent=t;b.onclick=f;$('actions').append(b)}
function check(){const q=current();if(q.correct)return;const ok=q.value!==''&&q.value===String(answerFor(q));if(!ok){q.wrong=true;sound('wrong');render();return}q.correct=true;q.wrong=false;sound('correct');const s=state();if(s.questions.every(x=>x.correct)){s.done=true;render();$('resultTitle').textContent='Level '+(level+1)+' Selesai!';$('resultScore').textContent='Skor '+total();$('advance').hidden=level===2;$('result').hidden=false;sound('complete');confetti()}else render()}
function closeResult(){$('result').hidden=true}function advance(){closeResult();level=Math.min(2,level+1);render()}function replay(){closeResult();sessions[level]=makeSession(level);render()}
let audio;function sound(kind){try{audio ||=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const notes=kind==='wrong'?[220,165]:kind==='complete'?[523,659,784,1047,784,1047]:[523,659,784];notes.forEach((f,i)=>{const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+.03+i*.14;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.08,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);g.connect(audio.destination);o.start(t);o.stop(t+.22)})}catch(e){}}
function confetti(){for(let i=0;i<65;i++){const c=document.createElement('i');c.className='confetti';c.style.background=['#f4cb70','#a9ddca','#96cce2','#ef987e'][i%4];c.style.left=Math.random()*100+'vw';c.style.top='-12px';document.body.append(c);const a=c.animate([{transform:'translateY(0)'},{transform:'translateY(105vh) rotate(650deg)'}],{duration:1800+Math.random()*1300});a.onfinish=()=>c.remove()}}
$('start').onclick=()=>{started=true;level=chosen;$('cover').hidden=true;document.querySelector('.app').classList.remove('cover-open');if(window.speechSynthesis)speechSynthesis.cancel();render()};
setTimeout(()=>{if(started||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance('Membaca Diagram Batang. Perhatikan diagram batang. Jawab pertanyaan sesuai data. Perhatikan angka pada sumbu dan tinggi batang.');u.lang='id-ID';u.rate=.85;speechSynthesis.speak(u)},300);buttons();render();
</script></body></html>
