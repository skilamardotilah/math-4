<script>
(()=>{const $=id=>document.getElementById(id),w=$('workspace'),c=$('controls'),f=$('feedback');
const classify=[{path:'M160 35 L275 230 L45 230 Z',yes:true},{path:'M160 35 Q295 125 225 235 L55 235 Z',yes:false},{path:'M65 55 L265 55 L265 220 L65 220 Z',yes:true},{path:'M55 215 L150 45 L265 215',yes:false},{path:'M160 25 L280 110 L235 235 L85 235 L40 110 Z',yes:true}];
const repair=[{path:'M60 220 L160 45 L270 220',issue:'open'},{path:'M65 55 Q165 5 265 55 L265 220 L65 220 Z',issue:'curve'},{path:'M60 225 L160 35 L265 225',issue:'open'},{path:'M75 50 L260 50 Q315 155 260 230 L75 230 Z',issue:'curve',fixed:'M75 50 L260 50 L260 230 L75 230 Z'},{path:'M160 30 L275 115 L235 230 L85 230',issue:'open'}];
const build=[{n:3,pts:[[160,38],[55,218],[265,218],[40,105],[275,115]]},{n:4,pts:[[70,55],[255,55],[255,220],[70,220],[165,135]]},{n:5,pts:[[160,35],[275,110],[235,225],[85,225],[45,110],[160,135]]},{n:6,pts:[[110,40],[220,40],[280,135],[220,230],[110,230],[45,135],[165,135]]},{n:4,pts:[[160,38],[272,130],[160,225],[48,130],[160,135]]}];
let level=1,round=0,hearts=3,score=0,locked=false,selected=[],finished=false;
function status(){const lv=$('levels');lv.innerHTML=[1,2,3].map(n=>`<button type="button" data-level="${n}" class="${level===n?'active':''}" aria-pressed="${level===n}">Level ${n}</button>`).join('');lv.querySelectorAll('button').forEach(b=>b.onclick=()=>{level=+b.dataset.level;round=0;locked=false;finished=false;render()});$('hearts').textContent='♥'.repeat(hearts)+'♡'.repeat(3-hearts);$('hearts').setAttribute('aria-label',`${hearts} hati`);$('score').textContent=`Skor: ${score}`}
function feedback(text='',kind=''){f.textContent=text;f.className='feedback '+kind}function wrong(text){if(locked)return;hearts--;status();feedback(text,'bad');if(!hearts){$('finalScore').textContent=`Skor: ${score}. Coba lagi, ya!`;$('modal').classList.remove('hidden')}}function right(text){locked=true;score+=10;status();feedback(text,'good');c.innerHTML='<button class="btn" id="next">Lanjut →</button>';$('next').onclick=()=>{locked=false;round++;if(round===5){complete();return}render()}}
function complete(){finished=true;status();$('title').textContent=`Level ${level} selesai!`;$('prompt').textContent='Pilih level lain di bagian atas.';w.innerHTML='<div class="sheet"><div style="font-size:65px;color:#efb947">★ ★ ★</div><p class="small">Kamu berhasil menyelesaikan 5 tantangan!</p></div>';c.innerHTML='<button class="btn alt" id="again">Ulangi Level Ini</button>';$('again').onclick=()=>{round=0;finished=false;render()};feedback()}
function svg(path,extra=''){return `<div class="sheet"><svg viewBox="0 0 320 265" role="img" aria-label="Gambar bangun datar"><path class="shape ${extra}" d="${path}"/></svg></div>`}
function render(){status();feedback();w.innerHTML='';c.innerHTML='';if(level===1)identify();if(level===2)fix();if(level===3)construct()}
function identify(){let q=classify[round];$('title').textContent='Kenali Segi Banyak';$('prompt').textContent=`Gambar ${round+1} dari 5 · Apakah ini segi banyak?`;w.innerHTML=svg(q.path,q.yes?'':'open');c.innerHTML='<button class="btn" data-answer="true">Ya</button><button class="btn alt" data-answer="false">Tidak</button>';c.querySelectorAll('button').forEach(b=>b.onclick=()=>String(q.yes)===b.dataset.answer?right(q.yes?'Benar! Tertutup dan semua sisinya lurus.':'Benar! Belum tertutup atau ada garis lengkung.'):wrong('Amati: harus tertutup dan sisinya lurus.'))}
function fix(){let q=repair[round];$('title').textContent='Perbaiki Bangunnya';$('prompt').textContent=`Gambar ${round+1} dari 5 · Apa yang harus diperbaiki?`;w.innerHTML=svg(q.path,q.issue==='open'?'open':'curve');c.innerHTML='<button class="btn" data-answer="open">Tutup garisnya</button><button class="btn alt" data-answer="curve">Luruskan sisinya</button>';c.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.answer===q.issue){let replacement=q.fixed||(q.issue==='open'?q.path+' Z':q.path.replace(/Q[^LZ]+/,'L265 55'));w.innerHTML=svg(replacement);right('Bagus! Sekarang bangunnya tertutup dan bersisi lurus.')}else wrong('Perhatikan ujung garis dan bentuk sisinya.')})}
function crossed(a,b,c,d){const orient=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);return orient(a,b,c)*orient(a,b,d)<0&&orient(c,d,a)*orient(c,d,b)<0}
function construct(){const q=build[round];$('title').textContent='Rakit Segi Banyak';$('prompt').textContent=`Hubungkan ${q.n} titik, lalu klik titik awal.`;selected=[];let markup=`<div class="sheet build"><svg viewBox="0 0 320 265" aria-label="Papan titik untuk membentuk segi banyak"><path id="drawing" class="line" d=""/>`;q.pts.forEach(([x,y],i)=>markup+=`<g class="dot" data-dot="${i}" role="button" tabindex="0" aria-label="Titik ${i+1}"><circle cx="${x}" cy="${y}" r="18"/><text x="${x}" y="${y+5}" text-anchor="middle">${i+1}</text></g>`);markup+='</svg></div>';w.innerHTML=markup+`<div class="badge" id="count">0 sisi</div>`;c.innerHTML='<button class="btn alt" id="erase">Ulangi Gambar</button>';$('erase').onclick=()=>{selected=[];draw()};const dots=w.querySelectorAll('[data-dot]');function draw(){const pts=selected.map(i=>q.pts[i]);w.querySelector('#drawing').setAttribute('d',pts.length?'M'+pts.map(p=>p.join(' ')).join(' L'):'');dots.forEach(d=>d.classList.toggle('used',selected.includes(+d.dataset.dot)));dots.forEach(d=>d.classList.toggle('first',selected.length>0&&+d.dataset.dot===selected[0]));$('count').textContent=selected.length?`${Math.max(0,selected.length-1)} sisi tergambar`:'0 sisi'}function tap(i){if(locked)return;if(selected.length&&i===selected[0]){if(selected.length<3){feedback('Pilih paling sedikit 3 titik.','bad');return}let pts=selected.map(k=>q.pts[k]),self=false;for(let a=0;a<pts.length;a++)for(let b=a+2;b<pts.length;b++){if(a===0&&b===pts.length-1)continue;if(crossed(pts[a],pts[(a+1)%pts.length],pts[b],pts[(b+1)%pts.length]))self=true}if(self){feedback('Garisnya bersilangan. Coba susun ulang.','bad');return}w.querySelector('#drawing').setAttribute('d','M'+pts.map(p=>p.join(' ')).join(' L')+' Z');if(selected.length===q.n)right(`Hebat! Bangun tertutup dengan ${q.n} sisi lurus.`);else wrong(`Bangunmu punya ${selected.length} sisi. Targetnya ${q.n}.`);return}if(selected.includes(i)){feedback('Titik itu sudah dipakai.','bad');return}selected.push(i);draw();feedback(selected.length===1?'Pilih titik berikutnya.':'Klik titik awal untuk menutup bangun.')}dots.forEach(d=>{d.onclick=()=>tap(+d.dataset.dot);d.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();tap(+d.dataset.dot)}}})}
$('restart').onclick=()=>{$('modal').classList.add('hidden');level=1;round=0;hearts=3;score=0;locked=false;render()};render()})();
</script></body></html>
