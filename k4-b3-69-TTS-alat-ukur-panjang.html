ius:18px;padding:5px 13px}.overlay{position:fixed;inset:0;display:grid;place-items:center;padding:14px;background:#193d4a9e}.modal{width:min(420px,100%);padding:25px;text-align:center;background:#fffdf4;border:5px solid white;border-radius:22px}.modal h2{margin:0;font:400 38px 'Londrina Solid';color:#16738c}.modal p{font-weight:800}.hidden{display:none!important}@media(max-width:850px){.layout{grid-template-columns:1fr;gap:12px}.clues{max-height:175px}.board-wrap{padding:7px}.intro h2{font-size:29px}main{justify-content:flex-start;padding:10px}}@media(max-width:430px){body{padding:7px}.app{min-height:calc(100dvh - 14px)}header,footer{padding:9px 12px}header{flex-wrap:wrap}.levels button{font-size:11px;padding:5px 8px}.board{gap:0}.board-wrap{padding:4px}.clue{font-size:11px}.intro p{font-size:12px}}

 MIKROMETERSEKRUP:['Sebuah lembar logam sangat tipis sulit diukur dengan penggaris. Mira memakai alat putar yang lebih teliti.','Sekrup putarnya membantu mengukur ketebalan benda sangat kecil dengan teliti.'],
 STADIOMETER:['Dalam pemeriksaan kesehatan, Lala berdiri tanpa alas kaki di bawah batang pengukur yang tegak.','Batang tegak dan penahan kepala dipakai untuk membaca tinggi badan.'],
 METERANPITA:['Kain untuk membuat baju harus diukur mengikuti lengkung bahu. Alat yang kaku tidak cocok.','Pita lentur mengikuti lekuk bahu dan tubuh tanpa kehilangan bentuk ukurannya.'],
 ODOMETER:['Panjang lintasan di halaman sekolah diukur dengan mendorong roda penghitung dari garis awal sampai akhir.','Roda yang bergulir menghitung jarak sepanjang lintasan.']
}];
const names={PENGGARIS:'Penggaris',METERANPITA:'Meteran pita',METERANGULUNG:'Meteran gulung',STADIOMETER:'Stadiometer',JANGKASORONG:'Jangka sorong',MIKROMETERSEKRUP:'Mikrometer sekrup',ODOMETER:'Odometer'};
let level=0,active=null,cursor=0,hearts=3,score=0,cells=new Map(),members=new Map();
const progress=layouts.map(()=>({values:{},solved:new Set()}));
function key(r,c){return r+','+c}function coords(w){return [...w.answer].map((_,i)=>[w.r+(w.dir==='Menurun'?i:0),w.c+(w.dir==='Mendatar'?i:0)])}
function current(){return layouts[level].words}function state(){return progress[level]}
function hud(){$('hearts').textContent='♥'.repeat(hearts)+'♡'.repeat(3-hearts);$('hearts').setAttribute('aria-label',`${hearts} hati`);$('score').textContent=`Skor: ${score}`;$('levels').querySelectorAll('button').forEach(b=>{b.classList.toggle('active',+b.dataset.level===level);b.setAttribute('aria-pressed',String(+b.dataset.level===level))})}
function feedback(text='',type=''){$('feedback').textContent=text;$('feedback').className='feedback '+type}
function explain(text=''){$('explanation').textContent=text;$('explanation').classList.toggle('hidden',!text)}
function select(w){active=w;cursor=coords(w).findIndex(p=>{let el=document.querySelector(`input[data-key="${key(...p)}"]`);return el&&!el.disabled&&!el.value});if(cursor<0)cursor=0;highlight();let el=document.querySelector(`input[data-key="${key(...coords(w)[cursor])}"]`);if(el&&!el.disabled)el.focus()}
function highlight(){document.querySelectorAll('.square.live').forEach(s=>s.classList.remove('active','cursor'));if(!active)return;coords(active).forEach(p=>document.querySelector(`.square[data-key="${key(...p)}"]`).classList.add('active'));document.querySelector(`.square[data-key="${key(...coords(active)[cursor])}"]`).classList.add('cursor');document.querySelectorAll('.clue').forEach(b=>{b.classList.toggle('active',+b.dataset.id===active.id);b.classList.toggle('done',state().solved.has(+b.dataset.id))})}
function move(step){let p=coords(active),i=Math.max(0,Math.min(p.length-1,cursor+step)),el=document.querySelector(`input[data-key="${key(...p[i])}"]`);if(el&&!el.disabled)el.focus()}
function render(){const words=current(),p=layouts[level];cells=new Map();members=new Map();words.forEach(w=>coords(w).forEach(([r,c],i)=>{let k=key(r,c),ch=w.answer[i];if(cells.has(k)&&cells.get(k)!==ch)throw Error('Silang tidak cocok');cells.set(k,ch);if(!members.has(k))members.set(k,[]);members.get(k).push(w)}));
 let html='';for(let r=0;r<p.rows;r++)for(let c=0;c<p.cols;c++){let k=key(r,c),start=words.find(w=>w.r===r&&w.c===c);html+=cells.has(k)?`<div class="square live" data-key="${k}">${start?`<b>${start.id}</b>`:''}<input maxlength="1" autocomplete="off" aria-label="Kotak baris ${r+1} kolom ${c+1}" data-key="${k}"></div>`:'<div class="square"></div>'}
 $('board').style.gridTemplateColumns=`repeat(${p.cols},var(--cell))`;$('board').style.gridTemplateRows=`repeat(${p.rows},var(--cell))`;$('board').innerHTML=html;
 $('clues').innerHTML=words.map(w=>`<button class="clue" data-id="${w.id}"><strong>${w.id} ${w.dir} (${w.answer.length})</strong><br>${content[level][w.answer][0]}</button>`).join('');
 document.querySelectorAll('.square.live input').forEach(el=>{let k=el.dataset.key;el.value=state().values[k]||'';if(members.get(k).some(w=>state().solved.has(w.id))){el.disabled=true;el.parentElement.classList.add('solved')}
 el.onfocus=()=>{let choices=members.get(k);if(!choices.includes(active))active=choices.find(w=>!state().solved.has(w.id))||choices[0];cursor=coords(active).findIndex(a=>key(...a)===k);highlight()};
 el.oninput=()=>{el.value=el.value.replace(/[^a-zA-Z]/g,'').slice(-1).toUpperCase();state().values[k]=el.value;feedback();if(el.value){let path=coords(active);for(let j=cursor+1;j<path.length;j++){let next=document.querySelector(`input[data-key="${key(...path[j])}"]`);if(next&&!next.disabled){next.focus();break}}}};
 el.onkeydown=e=>{if(e.key==='Backspace'&&!el.value){let path=coords(active);for(let j=cursor-1;j>=0;j--){let prev=document.querySelector(`input[data-key="${key(...path[j])}"]`);if(prev&&!prev.disabled){prev.focus();prev.value='';state().values[prev.dataset.key]='';break}}}if(['ArrowRight','ArrowDown','ArrowLeft','ArrowUp'].includes(e.key)){e.preventDefault();move(e.key==='ArrowRight'||e.key==='ArrowDown'?1:-1)}}});
 document.querySelectorAll('.clue').forEach(b=>b.onclick=()=>select(words.find(w=>w.id===+b.dataset.id)));
 active=words.find(w=>!state().solved.has(w.id))||words[0];cursor=0;$('levelTitle').textContent=`Level ${level+1} · ${['Alat sehari-hari','Pilih alat yang tepat','Tantangan pengukuran'][level]}`;feedback();explain();hud();select(active)}
function finish(){if(state().solved.size===5){feedback('Lima petunjuk selesai! Pilih level lain di atas.','good');$('check').disabled=true;$('discussion').disabled=true}else{$('check').disabled=false;$('discussion').disabled=false}}
function markSolved(w,revealed){state().solved.add(w.id);coords(w).forEach((p,i)=>{let k=key(...p),el=document.querySelector(`input[data-key="${k}"]`);el.value=w.answer[i];el.disabled=true;el.parentElement.classList.add('solved');state().values[k]=w.answer[i]});if(!revealed)score+=10;hud();highlight();finish()}
function modal(title,msg){$('modalTitle').textContent=title;$('modalText').textContent=msg;$('overlay').classList.remove('hidden')}
$('check').onclick=()=>{if(state().solved.has(active.id)){feedback('Kata ini sudah selesai.','good');return}let entered=coords(active).map(p=>document.querySelector(`input[data-key="${key(...p)}"]`).value).join('');if(entered.length<active.answer.length){feedback('Isi semua kotak pada kata ini dulu.','bad');return}if(entered===active.answer){markSolved(active,false);feedback(state().solved.size===5?'Level selesai! Pilih level lain di atas.':'Benar! Alat ukurnya tepat.','good')}else{hearts--;hud();feedback('Belum tepat. Baca lagi ceritanya.','bad');coords(active).forEach(p=>{let s=document.querySelector(`.square[data-key="${key(...p)}"]`);s.classList.add('wrong');setTimeout(()=>s.classList.remove('wrong'),800)});if(!hearts)modal('Hatinya habis!',`Skor akhir: ${score}. Coba lagi, ya!`)}};
$('discussion').onclick=()=>{if(state().solved.has(active.id)){explain(`${names[active.answer]}: ${content[level][active.answer][1]}`);return}hearts--;const answer=active.answer;markSolved(active,true);explain(`${names[answer]}: ${content[level][answer][1]}`);feedback(state().solved.size===5?'Level selesai! Pilih level lain di atas.':'Pembahasan terbuka. Satu hati berkurang.','good');if(!hearts)modal('Hatinya habis!',`${content[level][answer][1]} Skor akhir: ${score}.`)};
$('clear').onclick=()=>{if(state().solved.has(active.id))return;coords(active).forEach(p=>{let el=document.querySelector(`input[data-key="${key(...p)}"]`);if(!el.disabled){el.value='';state().values[el.dataset.key]=''}});select(active);feedback()};
$('restart').onclick=()=>{progress.forEach(p=>{p.values={};p.solved.clear()});hearts=3;score=0;level=0;$('overlay').classList.add('hidden');render();finish()};
$('levels').innerHTML=[0,1,2].map(i=>`<button type="button" data-level="${i}">Level ${i+1}</button>`).join('');$('levels').querySelectorAll('button').forEach(b=>b.onclick=()=>{level=+b.dataset.level;render();finish()});render();finish()
})();

</script></body></html>
