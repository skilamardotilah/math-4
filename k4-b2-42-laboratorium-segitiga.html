(()=>{const $=id=>document.getElementById(id),c=$('controls'),fb=$('feedback'),board=$('board');
const shapes={equilateral:[[160,36],[65,201],[255,201]],isosceles:[[160,38],[82,219],[238,219]],scalene:[[45,218],[273,207],[95,38]],right:[[55,38],[55,220],[265,220]],obtuse:[[45,188],[275,188],[160,130]],rightIso:[[75,55],[75,220],[240,220]],acute:[[35,220],[265,210],[110,55]],obtuseScalene:[[35,190],[275,190],[130,125]]};
const questions=[['equilateral','isosceles','scalene','rightIso','obtuseScalene'],['equilateral','right','obtuse','acute','rightIso'],['isosceles','right','obtuseScalene','rightIso','equilateral']];
let level=1,round=0,hearts=3,score=0,pts=[],locked=false,drag=null;
const length=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function classify(){const a=length(pts[1],pts[2]),b=length(pts[0],pts[2]),d=length(pts[0],pts[1]);const max=Math.max(a,b,d),min=Math.min(a,b,d);const side=max-min<max*.045?'Sama sisi':Math.abs(a-b)<max*.045||Math.abs(a-d)<max*.045||Math.abs(b-d)<max*.045?'Sama kaki':'Sembarang';const sq=[a*a,b*b,d*d].sort((x,y)=>x-y),delta=sq[2]-sq[1]-sq[0];const angle=Math.abs(delta)<sq[2]*.055?'Siku-siku':delta>0?'Tumpul':'Lancip';return{side,angle,lens:[d,a,b].map(x=>Math.round(x/10))}}
function ui(){let lv=$('levels');lv.innerHTML=[1,2,3].map(n=>`<button type="button" class="${n===level?'active':''}" data-level="${n}" aria-pressed="${n===level}">Level ${n}</button>`).join('');lv.querySelectorAll('button').forEach(x=>x.onclick=()=>{level=+x.dataset.level;round=0;locked=false;render()});$('hearts').textContent='♥'.repeat(hearts)+'♡'.repeat(3-hearts);$('hearts').setAttribute('aria-label',`${hearts} hati`);$('score').textContent=`Skor: ${score}`}
function updateGeometry(){$('triangle').setAttribute('points',pts.map(p=>p.join(',')).join(' '));$('points').querySelectorAll('.point').forEach((g,i)=>{const [x,y]=pts[i];g.querySelector('circle').setAttribute('cx',x);g.querySelector('circle').setAttribute('cy',y);g.querySelector('text').setAttribute('x',x);g.querySelector('text').setAttribute('y',y+5)});$('sides').textContent=`Sisi: ${classify().lens.join(' · ')}`}
function display(){$('triangle').setAttribute('points',pts.map(p=>p.join(',')).join(' '));$('points').innerHTML=pts.map(([x,y],i)=>`<g class="point" data-point="${i}" role="slider" aria-label="Titik ${'ABC'[i]}" tabindex="0"><circle cx="${x}" cy="${y}" r="16"/><text x="${x}" y="${y+5}" text-anchor="middle">${'ABC'[i]}</text></g>`).join('');const info=classify();$('sides').textContent=`Sisi: ${info.lens.join(' · ')}`;$('angles').textContent='Sudut: lihat bentuknya';$('points').querySelectorAll('.point').forEach(g=>{g.onpointerdown=e=>{if(locked)return;drag=+g.dataset.point;g.setPointerCapture(e.pointerId)};g.onpointermove=e=>{if(drag!==+g.dataset.point||locked)return;let pt=board.createSVGPoint();pt.x=e.clientX;pt.y=e.clientY;let loc=pt.matrixTransform(board.getScreenCTM().inverse());let candidate=[Math.max(25,Math.min(295,loc.x)),Math.max(25,Math.min(235,loc.y))];let newPts=pts.map(p=>p.slice());newPts[drag]=candidate;const area=Math.abs((newPts[1][0]-newPts[0][0])*(newPts[2][1]-newPts[0][1])-(newPts[2][0]-newPts[0][0])*(newPts[1][1]-newPts[0][1]));if(area>1000){pts=newPts;updateGeometry()}};g.onpointerup=g.onpointercancel=()=>{drag=null};g.onkeydown=e=>{const move={ArrowLeft:[-5,0],ArrowRight:[5,0],ArrowUp:[0,-5],ArrowDown:[0,5]}[e.key];if(!move||locked)return;e.preventDefault();const i=+g.dataset.point;pts[i][0]=Math.max(25,Math.min(295,pts[i][0]+move[0]));pts[i][1]=Math.max(25,Math.min(235,pts[i][1]+move[1]));display();$('points').querySelector(`[data-point="${i}"]`).focus()}})}
function feedback(t='',type=''){fb.textContent=t;fb.className='feedback '+type}function wrong(){hearts--;ui();feedback('Perhatikan panjang sisi dan besar sudutnya.','bad');if(!hearts){$('modalTitle').textContent='Hatinya habis!';$('modalText').textContent=`Skor: ${score}. Ayo coba lagi.`;$('overlay').classList.remove('hidden')}}function correct(){locked=true;score+=10;ui();const v=classify();feedback(`Benar! Segitiga ${v.side.toLowerCase()} dan ${v.angle.toLowerCase()}.`,'good');c.innerHTML='<button class="btn" id="next">Lanjut →</button>';$('next').onclick=()=>{round++;locked=false;if(round===5)complete();else render()}}
function complete(){ui();$('title').textContent=`Level ${level} selesai!`;$('prompt').textContent='Pilih level lain di bagian atas.';c.innerHTML='<button class="btn alt" id="again">Ulangi Level Ini</button>';$('again').onclick=()=>{round=0;render()};feedback('Kamu menyelesaikan 5 tantangan segitiga!','good')}
function render(){ui();feedback();let key=questions[level-1][round];pts=shapes[key].map(p=>p.slice());display();$('title').textContent=level===1?'Amati Sisinya':level===2?'Amati Sudutnya':'Kenali Keduanya';$('prompt').textContent=`Soal ${round+1} dari 5 · ${level===1?'Apa jenis segitiga berdasarkan sisinya?':level===2?'Apa jenis segitiga berdasarkan sudutnya?':'Pilih jenis sisi dan sudutnya.'}`;let options=level===1?['Sama sisi','Sama kaki','Sembarang']:level===2?['Lancip','Siku-siku','Tumpul']:['Sama kaki · Lancip','Sembarang · Siku-siku','Sembarang · Tumpul','Sama kaki · Siku-siku','Sama sisi · Lancip'];c.innerHTML=options.map(x=>`<button class="choice" data-answer="${x}">${x}</button>`).join('')+'<button class="btn alt" id="resetShape">Bentuk Awal</button>';c.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(locked)return;let v=classify(),answer=level===1?v.side:level===2?v.angle:`${v.side} · ${v.angle}`;b.dataset.answer===answer?correct():wrong()});$('resetShape').onclick=()=>{pts=shapes[key].map(p=>p.slice());display();feedback()}}
$('restart').onclick=()=>{$('overlay').classList.add('hidden');level=1;round=0;hearts=3;score=0;locked=false;render()};render()})();
</script></body></html>
