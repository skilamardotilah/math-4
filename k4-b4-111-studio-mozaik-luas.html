<!doctype html><html lang="id"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Studio Mozaik</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#d8eee9;font-family:'Trebuchet MS',sans-serif;color:#285b58}.app{width:min(1050px,97vw);border:5px solid white;background:#fffaf0;border-radius:24px;overflow:hidden;box-shadow:0 15px 45px #285b5820}header,footer{background:white;padding:13px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:27px;margin:0}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;font:700 15px 'Trebuchet MS';background:#258c83;color:white;box-shadow:0 3px #16645d}button:disabled{opacity:.4}button:active{transform:translateY(2px)}.levels,.palette,.answer{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.active{outline:3px solid #f7bb50}.prompt{text-align:center;font-size:21px;font-weight:bold;margin:14px 10px}.hint{text-align:center;font-size:13px;margin:9px}.palette{margin:12px}.color{width:38px;height:36px;padding:0}.board{padding:0 14px}canvas{width:100%;display:block;aspect-ratio:960/370;border:3px solid #cba474;border-radius:17px;background:#f0d5ad;touch-action:none}.answer{min-height:55px;margin:10px;align-items:center}input{font:700 22px 'Trebuchet MS';width:95px;padding:9px;border:2px solid #8dbbb1;border-radius:12px;text-align:center}.message{min-height:23px;text-align:center;font-weight:bold;margin:9px}.stats{color:#d46567;font-weight:bold}.modal{position:fixed;inset:0;background:#285b5877;display:grid;place-items:center;padding:20px}.card{background:#fffaf0;border:5px solid white;border-radius:25px;padding:28px;max-width:540px;text-align:center}.card p{line-height:1.6}.hidden{display:none}@media(max-width:600px){header,footer{flex-wrap:wrap;padding:10px}h1{font-size:22px}.levels button{font-size:12px;padding:8px 11px}.prompt{font-size:17px}canvas{aspect-ratio:960/550}button{font-size:13px}.hint{font-size:12px}.board{padding:0 5px}}</style><div class="app"><header><h1>🎨 Studio Mozaik</h1><div class="levels"><button onclick="start(1)">Level 1</button><button onclick="start(2)">Level 2</button><button onclick="start(3)">Level 3</button></div></header><div class="prompt" id="prompt"></div><div id="palette" class="palette"></div><div class="board"><canvas id="canvas" width="960" height="370"></canvas></div><div class="hint" id="hint"></div><div id="answer" class="answer"></div><div id="message" class="message" aria-live="polite"></div><footer><button onclick="menu()">Kembali ke Menu</button><span id="progress"></span><span id="stats" class="stats"></span><button id="next" onclick="next()" disabled>Berikutnya →</button></footer></div><div id="modal" class="modal"><div id="card" class="card"></div></div><script>
const $=id=>document.getElementById(id),cv=$('canvas'),g=cv.getContext('2d'),colors=['#ed7973','#f5c54d','#6fbfa4','#719de0','#ba93cc'];const rect=(w,h)=>Array.from({length:w*h},(_,i)=>[i%w,Math.floor(i/w)]);const shapes=[rect(3,3),rect(4,3),rect(5,2),rect(4,4),rect(5,3)];const irregular=[rect(4,4).filter(([x,y])=>x<2||y>1),rect(4,4).filter(([x,y])=>y<2||x===3),rect(5,4).filter(([x,y])=>y===0||x===0||x===4),rect(4,4).filter(([x,y])=>x<=y),rect(5,3).filter(([x,y])=>!(x===2&&y===1))];let level=1,q=0,stage=0,cells=[],pieces=[],stickers=[],color=0,drag=null,pointer=null,phase='place',active=false,points=0,hearts=3,smallAnswer=0,bigAnswer=0,sticker=0;const icons=['⭐','🌸','🦋','🌈','❤️'];
function menu(){active=false;drag=null;$('modal').classList.remove('hidden');$('card').innerHTML='<div style="font-size:60px">🎨🧩</div><h2>Studio Mozaik</h2><p>Seret kertas warna untuk menutup papan.<br>Hitung luas papan yang tertutup.<br>Jawaban benar membuka stiker hiasan!</p><p>1 · Papan sederhana<br>2 · Bentuk tidak beraturan<br>3 · Satu papan, dua ukuran kertas</p><button onclick="start(1)">Mulai Berkarya!</button>'}
function start(l){level=l;q=0;points=0;hearts=3;active=true;$('modal').classList.add('hidden');load()}
function load(){stage=0;phase='place';pieces=[];stickers=[];smallAnswer=0;bigAnswer=0;drag=null;pointer=null;cells=level===1?shapes[q]:level===2?irregular[q]:rect([4,6,4,6,8][q],[3,2,4,3,2][q]);$('message').textContent='';ui()}
function unit(){return level===3&&stage===1?2:1}
function layout(){let w=Math.max(...cells.map(c=>c[0]))+1,h=Math.max(...cells.map(c=>c[1]))+1;return{x:480-w*21,y:175-h*21,w,h,s:42}}
function covered(){return pieces.length*unit()===cells.length}
function ui(){document.querySelectorAll('.levels button').forEach((b,i)=>b.classList.toggle('active',i===level-1));$('palette').innerHTML='';$('answer').innerHTML='';$('next').disabled=phase!=='decorate';$('next').textContent=phase==='decorate'?'Selesai Menghias →':'Berikutnya →';$('progress').textContent='Soal '+(q+1)+' / 5';$('stats').textContent='♥'.repeat(hearts)+'♡'.repeat(3-hearts)+' · '+points+' poin';if(phase==='decorate'){icons.forEach((ic,i)=>addButton('palette',ic,()=>{sticker=i;ui()},i===sticker));$('prompt').textContent='Jawaban benar! Hias mozaikmu.';$('hint').textContent='Seret stiker dari kotak bawah ke papan.';addButton('answer','Hapus Stiker',()=>{stickers=[]})}else if(phase==='concept'){$('prompt').textContent='Apakah ukuran papan berubah?';$('hint').textContent='Bandingkan dua hasil pengukuran papan yang sama.';addButton('answer','Ya, berubah',()=>concept(false));addButton('answer','Tidak, tetap sama',()=>concept(true))}else{colors.forEach((c,i)=>{let b=document.createElement('button');b.className='color'+(color===i?' active':'');b.style.background=c;b.setAttribute('aria-label','Warna '+(i+1));b.onclick=()=>{color=i;ui()};$('palette').append(b)});$('prompt').textContent=covered()?'Berapa luas papan ini?':'Tutup papan dengan kertas '+(unit()===2?'persegi panjang!':'persegi!');$('hint').textContent='Seret kertas dari kotak bawah. Tanpa celah atau tumpang tindih.';if(covered()){let inp=document.createElement('input');inp.id='number';inp.type='number';inp.min=1;inp.step=1;inp.setAttribute('aria-label','Luas papan');inp.onkeydown=e=>{if(e.key==='Enter')check()};$('answer').append(inp);let label=document.createElement('span');label.textContent=unit()===2?'satuan kertas persegi panjang':'persegi satuan';$('answer').append(label);addButton('answer','Periksa',check)}else addButton('answer','Lepas Kertas Terakhir',()=>{pieces.pop();ui()},false,pieces.length===0)}}
function addButton(id,t,fn,on=false,disabled=false){let b=document.createElement('button');b.textContent=t;b.onclick=fn;b.disabled=disabled;b.classList.toggle('active',on);$(id).append(b)}
function wrong() {hearts--;$('message').textContent='Belum tepat. Hitung luas papan dengan satuan yang digunakan.';if(hearts===0)finish(false);else ui()}
function check(){if(!active||!covered())return;let n=Number($('number').value);if(n!==pieces.length){wrong();return}if(level===3&&stage===0){smallAnswer=n;stage=1;pieces=[];$('message').textContent='Sekarang ukur papan yang sama dengan kertas lebih besar.';ui()}else if(level===3){bigAnswer=n;phase='concept';$('message').textContent=smallAnswer+' kertas persegi = '+bigAnswer+' kertas persegi panjang.';ui()}else unlock()}
function concept(ok){if(ok)unlock();else wrong()}
function unlock(){phase='decorate';points+=20;$('message').textContent=level===3?'Papan tetap sama. Kertas lebih besar dibutuhkan lebih sedikit.':'Luas papan = '+pieces.length+' persegi satuan.';ui()}
function next(){if(phase!=='decorate')return;if(q===4)finish(true);else{q++;load()}}
function finish(win){active=false;$('modal').classList.remove('hidden');$('card').innerHTML='<h2>'+(win?'Karya mozaik selesai!':'Coba lagi, yuk!')+'</h2><p>'+points+' poin<br>Luas diukur dengan satuan yang menutup bidang tanpa celah.<br>Gunakan satuan dengan ukuran yang sama dalam satu pengukuran.</p><button onclick="start('+level+')">Main Lagi</button> '+(win&&level<3?'<button onclick="start('+(level+1)+')">Level Berikutnya</button>':'')+'<p><button onclick="menu()">Menu</button></p>'}
function pos(e){let r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*960/r.width,y:(e.clientY-r.top)*370/r.height}}
function cellAt(p){let a=layout();return[Math.floor((p.x-a.x)/42),Math.floor((p.y-a.y)/42)]}
function exists(x,y){return cells.some(c=>c[0]===x&&c[1]===y)}
function place(x,y){let u=unit();if(u===2)x=Math.floor(x/2)*2;let targets=Array.from({length:u},(_,i)=>[x+i,y]);if(targets.some(([xx,yy])=>!exists(xx,yy)||pieces.some(p=>p.y===yy&&xx>=p.x&&xx<p.x+u)))return false;pieces.push({x,y,color});ui();if(covered())$('message').textContent='Papan tertutup! Hitung luasnya.';return true}
cv.onpointerdown=e=>{if(!active)return;e.preventDefault();cv.setPointerCapture(e.pointerId);pointer=pos(e);if(Math.hypot(pointer.x-480,pointer.y-321)<75&&(phase==='place'||phase==='decorate'))drag=phase};cv.onpointermove=e=>pointer=pos(e);cv.onpointerup=e=>{if(!active)return;let p=pos(e),[x,y]=cellAt(p);if(drag==='place'&&!place(x,y))$('message').textContent='Pasang di bagian kosong dalam papan.';if(drag==='decorate'&&exists(x,y))stickers.push({x:p.x,y:p.y,icon:icons[sticker]});drag=null;pointer=null};cv.onpointercancel=()=>{drag=null;pointer=null};
function draw(){g.clearRect(0,0,960,370);g.fillStyle='#f0d5ad';g.fillRect(0,0,960,370);g.strokeStyle='#ddba91';for(let y=20;y<370;y+=48){g.beginPath();g.moveTo(0,y);g.lineTo(960,y);g.stroke()}let a=layout();g.fillStyle='#bb895b';g.fillRect(a.x-15,a.y-15,a.w*42+30,a.h*42+30);cells.forEach(([x,y])=>{g.fillStyle='#fff9e9';g.fillRect(a.x+x*42,a.y+y*42,42,42);g.strokeStyle='#e4d5b5';g.strokeRect(a.x+x*42,a.y+y*42,42,42)});pieces.forEach(p=>{g.fillStyle=colors[p.color];g.fillRect(a.x+p.x*42+1,a.y+p.y*42+1,42*unit()-2,40);g.strokeStyle='#ffffffa0';g.strokeRect(a.x+p.x*42+1,a.y+p.y*42+1,42*unit()-2,40)});if(level===3){g.fillStyle='#285b58';g.font='bold 16px Trebuchet MS';g.textAlign='center';g.fillText(stage===0?'Pengukuran 1 · Kertas kecil':'Pengukuran 2 · Kertas besar',480,28)}stickers.forEach(s=>{g.font='30px sans-serif';g.textAlign='center';g.fillText(s.icon,s.x,s.y+10)});if(phase==='place'||phase==='decorate'){g.fillStyle='#fffaf0';g.beginPath();g.roundRect(402,291,156,69,14);g.fill();if(phase==='place'){g.fillStyle=colors[color];g.fillRect(480-unit()*21,301,unit()*42,42)}else{g.font='38px sans-serif';g.textAlign='center';g.fillText(icons[sticker],480,341)}}if(drag&&pointer){if(drag==='place'){g.globalAlpha=.8;g.fillStyle=colors[color];g.fillRect(pointer.x-unit()*21,pointer.y-21,unit()*42,42);g.globalAlpha=1}else{g.font='36px sans-serif';g.fillText(icons[sticker],pointer.x,pointer.y)}}requestAnimationFrame(draw)}load();menu();requestAnimationFrame(draw);
</script></html>
