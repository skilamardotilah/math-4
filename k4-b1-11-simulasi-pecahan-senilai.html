<style>

:root{--ink:#24465a;--blue:#1289a9;--teal:#39b9a4;--cream:#fff9e9;--orange:#ffad4d;--red:#e8626b}*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 14%,#ffe2a9 0 3%,transparent 3.2%),radial-gradient(circle at 90% 70%,#b6e9d5 0 4%,transparent 4.2%),linear-gradient(145deg,#d7f6e9,#c9eafa 55%,#fff0c7)}button{font:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.48}.game{width:min(960px,100%);min-height:min(650px,calc(100dvh - 32px));display:flex;flex-direction:column;background:var(--cream);border:4px solid white;border-radius:28px;box-shadow:0 20px 50px #367b9060;overflow:hidden}header,footer{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 23px;background:#fff;flex-wrap:wrap}header{border-bottom:3px solid #e4f0e9}.brand{display:flex;align-items:center;gap:11px}.brandmark{width:36px;height:36px;object-fit:contain;display:block;flex:none}.brand h1{font:400 clamp(24px,3vw,31px) 'Londrina Solid',sans-serif;margin:0;color:#176880}.levels{display:flex;gap:6px}.levels button{padding:6px 11px;border:0;border-radius:20px;background:#e9f1ee;color:var(--ink);font-weight:900;font-size:13px}.levels button:hover{background:#cce9e3}.levels .active{color:white;background:var(--blue)}main{flex:1;padding:18px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.intro{text-align:center}.intro h2{font:400 clamp(27px,4vw,38px) 'Londrina Solid';margin:0 0 5px;color:#176880}.intro p{margin:0;font-size:clamp(14px,2vw,17px);font-weight:800}.play{width:100%;display:flex;align-items:center;justify-content:center;gap:15px;flex-wrap:wrap}.card,.board-panel,.machine{background:white;border:3px solid #d8e8e4;border-radius:20px;padding:13px;box-shadow:0 6px 0 #cce3db;text-align:center}.card{min-width:142px;transition:transform .15s,border-color .15s}.card:hover:not(:disabled){transform:translateY(-3px)}.card.selected{border-color:#f9a43f;background:#fff3d5}.card.done{border-color:#4ebf9c;background:#e7f8ed}.card strong,.board-panel strong{display:block;font-size:19px;margin-top:5px}.grid{width:110px;height:110px;display:grid;gap:2px;margin:auto;padding:2px;background:#a4c5c5;border-radius:7px}.cell{background:#fff;border-radius:2px;min-width:0;min-height:0}.cell.on{background:#54bfaa}.board-panel .grid{width:clamp(124px,17vw,160px);height:clamp(124px,17vw,160px)}.board-panel.clickable .cell{cursor:pointer}.board-panel.clickable .cell:hover{outline:3px solid #f9a43f;z-index:1}.arrow{font:400 34px 'Londrina Solid';color:var(--blue)}.fraction{font:400 30px 'Londrina Solid';color:#15788f;display:flex;justify-content:center;align-items:center;gap:6px}.fraction small{font:800 15px Nunito;color:#4d6d78}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.btn{border:0;border-radius:14px;background:var(--blue);color:#fff;padding:10px 22px;font-weight:900;box-shadow:0 4px 0 #086179}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #086179}.btn.alt{background:#fff;color:#176880;border:2px solid #bcdcd8;box-shadow:none}.message{min-height:28px;text-align:center;font-weight:900;color:#21657a}.message.good{color:#178068}.message.bad{color:#c84452}.machine{width:min(570px,100%);padding:17px;background:linear-gradient(#eaf8f3,#fff);border:4px solid #67b8ad}.machine-window{display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap}.machine .grid{width:140px;height:140px;transition:transform .3s}.machine.cut .grid{animation:pop .4s}@keyframes pop{50%{transform:scale(1.08)}}.machine .fraction{margin-top:7px}.choice{background:#fff;border:2px solid #94d0c9;border-radius:13px;padding:9px 18px;font-weight:900;color:#176880}.choice:hover{background:#def6ee}footer{border-top:3px solid #e4f0e9;min-height:57px;justify-content:flex-end;font-weight:900;font-size:18px}.hearts{letter-spacing:3px;color:var(--red);font-size:25px;line-height:1}.score{background:#e2f6ee;border-radius:22px;padding:5px 13px}.overlay{position:fixed;inset:0;background:#143b4ca8;display:grid;place-items:center;padding:18px}.modal{width:min(430px,100%);padding:27px;text-align:center;background:#fffdf5;border-radius:24px;border:5px solid #fff;box-shadow:0 12px 40px #153f5360}.modal h2{font:400 38px 'Londrina Solid';margin:0 0 8px;color:#176880}.modal p{font-weight:800}.hidden{display:none!important}@media(max-width:650px){body{padding:10px}.game{min-height:calc(100dvh - 20px);border-radius:20px}header,footer{padding:10px 13px}.brand h1{font-size:24px}.levels button{font-size:11px;padding:5px 8px}main{padding:12px;gap:12px}.card{min-width:125px;padding:9px}.grid{width:92px;height:92px}.board-panel{padding:9px}.board-panel .grid{width:115px;height:115px}.play{gap:8px}.arrow{font-size:25px}.machine .grid{width:115px;height:115px}}@media(max-width:390px){.card{min-width:104px}.grid{width:78px;height:78px}.board-panel .grid{width:98px;height:98px}.machine .grid{width:100px;height:100px}.brand h1{font-size:22px}}
</style>

<script>
(()=>{
const $=id=>document.getElementById(id),levels=$('levels'),play=$('play'),controls=$('controls'),message=$('message');
const pairs=[[[1,2],[2,4]],[[1,3],[2,6]],[[1,4],[2,8]],[[2,3],[4,6]],[[3,4],[6,8]]];
const paints=[{a:1,b:2,d:4},{a:1,b:3,d:6},{a:2,b:3,d:9},{a:3,b:4,d:8},{a:1,b:4,d:8}];
const cuts=[{a:1,b:2,f:2,type:"area"},{a:1,b:3,f:2,type:"colored"},{a:2,b:4,f:2,type:"total"},{a:1,b:4,f:2,type:"equation"},{a:2,b:3,f:2,type:"factor"}];
let level=1,round=0,hearts=3,score=0,selection=null,painted=new Set(),cutDone=false,answered=false,locked=false;
const setMessage=(s='',kind='')=>{message.textContent=s;message.className='message '+kind};
const hud=()=>{levels.innerHTML=[1,2,3].map(n=>`<button type="button" class="${level===n?'active':''}" data-level="${n}" aria-pressed="${level===n}">Level ${n}</button>`).join('');levels.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{level=+b.dataset.level;round=0;locked=false;render()});$('hearts').textContent='♥'.repeat(hearts)+'♡'.repeat(3-hearts);$('hearts').setAttribute('aria-label',`${hearts} hati`);$('score').textContent=`Skor: ${score}`};
function grid(n,d,lit,click){const cols=d===9||d===6||d===3?3:d===8?4:d===4||d===2?2:d;const rows=d/cols;let h=`<div class="grid" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">`;for(let i=0;i<d;i++)h+=`<div class="cell ${lit.includes(i)?'on':''}" ${click?`data-index="${i}" role="button" tabindex="0" aria-label="Bagian ${i+1}" aria-pressed="${lit.includes(i)}"`:''}></div>`;return h+'</div>'}
const visual=(a,b)=>{let lit=Array.from({length:a},(_,i)=>i);if(b===4&&a===2)lit=[0,2];if(b===6&&a===2)lit=[0,3];if(b===8&&a===2)lit=[0,1];if(b===8&&a===4)lit=[0,1,4,5];if(b===9&&a===6)lit=[0,1,3,4,6,7];return grid(a,b,lit,false)};
function next(){locked=false;round++;if(round===(level===1?pairs.length:level===2?paints.length:cuts.length)){showLevelComplete();return}render()}
function showLevelComplete(){equivSound("complete");equivParty();hud();$('title').textContent=`Level ${level} selesai!`;$('instruction').textContent='Pilih level lain di bagian atas untuk bermain.';play.innerHTML='<div class="machine"><div class="fraction">★ ★ ★</div><p>Hebat! Kamu sudah menyelesaikan level ini.</p></div>';controls.innerHTML='<button class="btn alt" id="replay">Ulangi Level Ini</button>';$('replay').onclick=()=>{shuffleQuestions();round=0;locked=false;render()};setMessage()}
function mistake(hint){if(locked)return;equivSound("wrong");hearts--;hud();setMessage(hint,'bad');if(!hearts){showEnd(false)}}
function showEnd(win){$('modalTitle').textContent=win?'Hebat! Semua level selesai!':'Hatinya habis!';$('modalText').textContent=`Skor akhir: ${score}. ${win?'Kamu sudah menemukan pecahan senilai!':'Ayo coba lagi.'}`;$('modalButton').textContent='Main Lagi';$('overlay').classList.remove('hidden')}
function success(text){if(locked)return;equivSound("correct");locked=true;score+=10;hud();setMessage(text,'good');controls.innerHTML='<button class="btn" id="next">Lanjut →</button>';$('next').onclick=next}
function render(){hud();setMessage();play.innerHTML='';controls.innerHTML='';if(level===1)renderMatch();else if(level===2)renderPaint();else renderCut()}
function renderMatch(){let [left,right]=pairs[round];$('title').textContent='Temukan Pasangannya';$('instruction').textContent='Pilih dua gambar dengan luas warna sama.';let cards=[{id:'a',n:left},{id:'b',n:right},{id:'c',n:[right[0]+1,right[1]]}];if(round%2)cards=[cards[2],cards[0],cards[1]];play.innerHTML=cards.map(c=>`<button class="card" data-card="${c.id}" aria-label="${c.n[0]} dari ${c.n[1]} bagian">${visual(...c.n)}<strong>${c.n[0]}/${c.n[1]}</strong></button>`).join('');selection=null;play.querySelectorAll('[data-card]').forEach(btn=>btn.onclick=()=>{if(locked)return;if(selection===btn){btn.classList.remove('selected');selection=null;return}if(!selection){selection=btn;btn.classList.add('selected');return}let ids=[selection.dataset.card,btn.dataset.card].sort().join('');selection.classList.remove('selected');selection=null;if(ids==='ab'){play.querySelectorAll('[data-card="a"],[data-card="b"]').forEach(x=>x.classList.add('done'));success(`Benar! ${left.join('/')} = ${right.join('/')}. Luas warnanya sama.`)}else mistake('Luas warnanya berbeda. Coba pilih lagi!')})}
function renderPaint(){const q=paints[round];$('title').textContent='Warnai Pecahannya';$('instruction').textContent=`Warnai papan kanan agar senilai dengan ${q.a}/${q.b}.`;painted=new Set();play.innerHTML=`<div class="board-panel">${visual(q.a,q.b)}<strong>${q.a}/${q.b}</strong></div><div class="arrow">=</div><div class="board-panel clickable" id="target">${grid(0,q.d,[],true)}<strong id="paintLabel">0/${q.d}</strong></div>`;let box=$('target');function toggle(cell){if(locked)return;const i=+cell.dataset.index;painted.has(i)?painted.delete(i):painted.add(i);cell.classList.toggle('on',painted.has(i));cell.setAttribute('aria-pressed',painted.has(i));$('paintLabel').textContent=`${painted.size}/${q.d}`;setMessage()}box.querySelectorAll('.cell').forEach(c=>{c.onclick=()=>toggle(c);c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle(c)}}});controls.innerHTML='<button class="btn" id="check">Periksa</button><button class="btn alt" id="clear">Hapus Warna</button>';$('clear').onclick=()=>{if(locked)return;painted.clear();box.querySelectorAll('.cell').forEach(c=>{c.classList.remove('on');c.setAttribute('aria-pressed','false')});$('paintLabel').textContent=`0/${q.d}`;setMessage()};$('check').onclick=()=>{if(!painted.size){setMessage('Warnai beberapa bagian dahulu.','bad');return}if(painted.size*q.b===q.a*q.d)success(`Benar! ${q.a}/${q.b} = ${painted.size}/${q.d}. Luasnya sama.`);else mistake('Jumlah bagian berwarna belum senilai. Coba lagi!')}}
function renderCut(){const q=cuts[round];$('title').textContent='Mesin Pemotong Pecahan';$('instruction').textContent='Bagi setiap bagian, lalu amati hasilnya.';cutDone=false;answered=false;play.innerHTML=`<div class="machine" id="machine"><div class="machine-window"><div id="before">${visual(q.a,q.b)}<div class="fraction">${q.a}/${q.b}</div></div><div class="arrow">→</div><div id="after">${visual(q.a,q.b)}<div class="fraction">${q.a}/${q.b}</div></div></div></div>`;controls.innerHTML='<button class="btn" id="cut">Bagi Lagi!</button>';$('cut').onclick=()=>{if(cutDone)return;cutDone=true;const n=q.a*q.f,d=q.b*q.f;$('after').innerHTML=visual(n,d)+`<div class="fraction">${n}/${d}</div>`;$('machine').classList.add('cut');const questions={area:['Apakah luas warna berubah?',[['Tetap sama',true],['Berubah',false]]],colored:['Mengapa kedua pecahan ini senilai?', [['Luas warna sama',true],['Banyak bagian sama',false],['Penyebutnya sama',false]]],total:['Sekarang persegi terbagi menjadi berapa bagian?',[[String(d),true],[String(d-2),false],[String(q.b),false]]],equation:['Manakah pecahan yang senilai?',[[`${q.a}/${q.b} = ${n}/${d}`,true],[`${q.a}/${q.b} = ${n+1}/${d}`,false]]],factor:['Setiap bagian awal dibagi menjadi berapa?',[[String(q.f),true],[String(q.f+1),false],[String(d),false]]]};const [prompt,options]=questions[q.type];$('instruction').textContent=prompt;const ordered=round%2?options.slice().reverse():options;controls.innerHTML=ordered.map(([label,correct])=>`<button class="choice" data-correct="${correct}">${label}</button>`).join('');controls.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(answered||locked)return;if(b.dataset.correct==='true'){answered=true;success(`Tepat! ${q.a}/${q.b} = ${n}/${d}. Luas warnanya tetap.`)}else mistake('Amati lagi gambar setelah dipotong, lalu coba lagi!')})}}
$('modalButton').onclick=()=>{$('overlay').classList.add('hidden');level=1;round=0;hearts=3;score=0;locked=false;render()};

let equivAudio,selectedCover=1,introRead=false,introStopped=false,introVoice;
async function equivSound(kind){try{equivAudio ||= new(window.AudioContext||window.webkitAudioContext)();if(equivAudio.state==='suspended')await equivAudio.resume();const notes=kind==='wrong'?[220,165]:kind==='complete'?[523,659,784,1047,784,1047,1319]:[659,880];notes.forEach((f,i)=>{const o=equivAudio.createOscillator(),g=equivAudio.createGain(),t=equivAudio.currentTime+.03+i*.13;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.13,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.23);o.connect(g);g.connect(equivAudio.destination);o.start(t);o.stop(t+.24)})}catch(e){}}
function equivParty(){for(let i=0;i<70;i++){const p=document.createElement('i');p.className='equiv-party';p.style.cssText='left:'+Math.random()*100+'%;background:'+['#54bfaa','#f3c47e','#8cc9e0','#ed9f9c'][i%4]+';animation-delay:'+Math.random()*.5+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),4000)}}
function shuffleQuestions(){const bank=level===1?pairs:level===2?paints:cuts;const old=bank.slice();for(let i=bank.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bank[i],bank[j]]=[bank[j],bank[i]]}if(bank.every((x,i)=>x===old[i]))bank.push(bank.shift())}
function readIntro(){if(introRead||introStopped||!window.speechSynthesis)return;speechSynthesis.cancel();introVoice=new SpeechSynthesisUtterance('Pecahan Senilai. Caranya: Temukan gambar dengan luas warna yang sama. Ikuti petunjuk pada setiap level.');introVoice.lang='id-ID';introVoice.rate=.85;const voices=speechSynthesis.getVoices(),v=voices.find(v=>/^id[-_]/i.test(v.lang)&&v.localService)||voices.find(v=>/^id[-_]/i.test(v.lang));if(v)introVoice.voice=v;introVoice.onstart=()=>introRead=true;speechSynthesis.speak(introVoice)}
if(window.speechSynthesis){speechSynthesis.addEventListener('voiceschanged',readIntro);setTimeout(readIntro,300)}document.addEventListener('click',e=>{if(!e.target.closest('#equivStart')&&!introRead&&!introStopped)readIntro()});
document.querySelectorAll('[data-cover-level]').forEach(b=>b.onclick=()=>{selectedCover=+b.dataset.coverLevel;document.querySelectorAll('[data-cover-level]').forEach(x=>x.classList.toggle('active',x===b))});
$('equivStart').onclick=()=>{introStopped=true;if(window.speechSynthesis)speechSynthesis.cancel();$('equivCover').hidden=true;document.querySelector('.game').classList.remove('cover-open');level=selectedCover;round=0;locked=false;render()};
function fitCover(){const c=$('equivCover'),w=c.firstElementChild;w.style.transform='';const scale=Math.min(1,(c.clientHeight-24)/w.offsetHeight);if(scale>0)w.style.transform='scale('+scale+')'}new ResizeObserver(fitCover).observe(document.querySelector('.game'));document.fonts.ready.then(fitCover);window.addEventListener('resize',fitCover);render();
})();
</script></body></html>
