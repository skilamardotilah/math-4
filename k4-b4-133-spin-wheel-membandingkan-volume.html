<!doctype html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Membandingkan Volume</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800;900&display=swap");
:root{--ink:#17121f;--yellow:#ffd84d;--blue:#6fa8ff;--green:#48c97f;--red:#ef6b6b;--purple:#8b78d7}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:12px;background:#e2d6f8;font-family:"Nunito",sans-serif;color:#332c3a;display:flex;align-items:center;justify-content:center}
.page{width:100%;max-width:1320px;background:#fff;border:2px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:7px 7px 0 var(--ink)}
header{min-height:72px;background:var(--ink);border-bottom:4px solid var(--yellow);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:42px;height:42px;object-fit:contain}.brand h1{font:600 20px "Fredoka";margin:0}
.score{background:#fff;color:#55426d;border-radius:14px;padding:7px 15px;text-align:center;font:600 13px "Fredoka"}.score b{display:block;font-size:20px;color:#6c55bd}
main{display:grid;grid-template-columns:430px minmax(0,1fr);gap:20px;padding:18px;background:#fffaf1;min-height:610px}
.wheel-side{display:flex;flex-direction:column;align-items:center;justify-content:center}
.wheel-title{font:600 18px "Fredoka";color:#6c55bd;margin:0 0 4px}.wheel-note{font-size:13px;font-weight:800;color:#746a7a;text-align:center;margin:0 0 12px}
.wheel-wrap{position:relative;width:390px;height:390px;display:flex;align-items:center;justify-content:center}
.pointer{position:absolute;right:-3px;top:50%;transform:translateY(-50%);width:0;height:0;border-top:18px solid transparent;border-bottom:18px solid transparent;border-right:34px solid var(--ink);z-index:5}
#wheel{width:360px;height:360px;border-radius:50%;border:7px solid var(--ink);box-shadow:0 8px 0 #0002;transition:transform 4.3s cubic-bezier(.12,.75,.12,1)}
.spin-btn{margin-top:12px;border:2px solid var(--ink);border-radius:999px;background:var(--yellow);padding:12px 30px;font:700 17px "Fredoka";color:#5b4300;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.spin-btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}.spin-btn:disabled{opacity:.55;cursor:not-allowed}
.progress{margin-top:13px;font-size:12px;font-weight:900;color:#746a7a}
.question-side{display:flex;align-items:center;justify-content:center}
.card{width:100%;max-width:760px;background:#fff;border:2px solid #dfd4ee;border-radius:20px;padding:22px;box-shadow:0 6px 0 #0000000d}
.empty{text-align:center;padding:70px 20px}.empty .big{font-size:70px}.empty h2{font:600 24px "Fredoka";color:#6c55bd;margin:10px 0 5px}.empty p{font-weight:800;color:#7b7280}
.badge{display:inline-block;background:#6c55bd;color:#fff;border-radius:999px;padding:6px 13px;font:600 13px "Fredoka";margin-bottom:12px}
.qtext{font-size:16px;line-height:1.65;font-weight:900;white-space:pre-line;margin-bottom:20px}
.answer-row{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0}
.box,.fixed{width:105px;height:72px;border-radius:14px;display:flex;align-items:center;justify-content:center;font:700 25px "Fredoka"}
.box{border:3px dashed #7b65c3;background:#f2edff;cursor:pointer}.box.filled{border-style:solid;background:#fff}.fixed{border:3px solid #ddd2ef;background:#fff}
.sign{font:700 28px "Fredoka";color:#81768a}.box.correct{border-color:var(--green);background:#eafff1}.box.wrong{border-color:var(--red);background:#fff0f0}
.choices-label{text-align:center;font-size:13px;font-weight:900;color:#786f7e;margin:14px 0 8px}
.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:9px}.choice{border:2px solid #d9cfec;background:#fff;border-radius:12px;padding:10px 16px;font:700 16px "Fredoka";color:#5f4d91;box-shadow:0 3px 0 #d9cfec;cursor:pointer}.choice.used{background:#7560bb;color:#fff;border-color:#7560bb}.choice:disabled{opacity:.45}
.actions{display:flex;justify-content:center;gap:10px;margin-top:20px}.check,.clear{border:0;border-radius:999px;padding:11px 22px;font:700 15px "Fredoka";cursor:pointer}.check{background:var(--green);color:#fff;box-shadow:0 4px 0 #2b9658}.clear{background:#eee9f6;color:#655d6d;box-shadow:0 4px 0 #d5ccdf}
.feedback{text-align:center;min-height:25px;margin-top:12px;font:600 14px "Fredoka"}.success{color:#24874d}.error{color:#cf4f4f}
.done-card{text-align:center;padding:60px 20px}.done-card .big{font-size:65px}.done-card h2{font:600 25px "Fredoka";color:#6c55bd}.restart{border:2px solid var(--ink);background:var(--yellow);border-radius:999px;padding:11px 22px;font:700 15px "Fredoka";cursor:pointer}
footer{height:12px;background:var(--ink);border-top:4px solid var(--yellow)}
@media(max-width:900px){main{grid-template-columns:1fr;min-height:0}.wheel-wrap{width:330px;height:330px}#wheel{width:305px;height:305px}.wheel-side{padding-top:5px}.card{padding:16px}}
@media(max-width:480px){body{padding:5px}.brand h1{font-size:15px}.brand img{width:34px;height:34px}.wheel-wrap{width:280px;height:280px}#wheel{width:255px;height:255px}.pointer{right:1px}.box,.fixed{width:82px;height:60px;font-size:20px}.qtext{font-size:14px}main{padding:10px;gap:8px}}

/* Drag & drop */
.box{cursor:default}
.choice{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.choice:active{cursor:grabbing}
.choice.dragging{opacity:.45;transform:scale(.96)}
.box.drag-over{border-color:#48c97f!important;background:#eafff1!important;transform:scale(1.04)}
.choices-label{font-weight:900}

/* Mobile: roda dan kotak jawaban lebih kecil */
@media(max-width:480px){
  .wheel-wrap{width:220px!important;height:220px!important}
  #wheel{width:198px!important;height:198px!important;border-width:5px!important}
  .pointer{
    right:1px!important;
    border-top-width:12px!important;
    border-bottom-width:12px!important;
    border-right-width:23px!important
  }
  .spin-btn{margin-top:6px!important;padding:9px 22px!important;font-size:14px!important}
  .wheel-title{font-size:15px!important}
  .wheel-note{font-size:11px!important;margin-bottom:4px!important}
  .progress{margin-top:8px!important;font-size:10px!important}
  .box,.fixed{
    width:64px!important;
    height:48px!important;
    border-radius:10px!important;
    font-size:16px!important
  }
  .answer-row{gap:6px!important;margin:9px 0!important}
  .sign{font-size:19px!important}
  .choice{
    padding:7px 10px!important;
    font-size:13px!important;
    border-radius:9px!important
  }
  .choices{gap:6px!important}
  .choices-label{font-size:11px!important;margin:8px 0 5px!important}
  .card{padding:11px!important}
  .qtext{font-size:12px!important;line-height:1.45!important;margin-bottom:9px!important}
  .badge{font-size:10px!important;padding:4px 9px!important;margin-bottom:6px!important}
  .actions{margin-top:11px!important;gap:7px!important}
  .check,.clear{padding:8px 13px!important;font-size:12px!important}
  .feedback{font-size:11px!important;margin-top:7px!important}
  .empty{padding:28px 10px!important}
  .empty .big{font-size:42px!important}
  .empty h2{font-size:18px!important}
}
.vessels{display:flex;justify-content:center;gap:8px;margin:7px 0}.vessel{width:clamp(45px,15%,90px);text-align:center;font-size:13px}.vessel svg{display:block;width:100%;height:145px}.volume-note{text-align:center;font-size:11px;margin:4px}.box{font-size:16px!important;min-width:90px}.choice{font-size:14px!important}.answer-row{flex-wrap:wrap}.fixed{width:65px!important}@media(max-height:760px){.vessel svg{height:110px}.vessel{max-width:75px}.vessel svg{width:100%}}
</style>

<style>
@media(max-width:480px){
  .wheel-wrap{
    width:174px!important;
    height:174px!important;
  }
  #wheel{
    width:154px!important;
    height:154px!important;
    border-width:4px!important;
  }
  .pointer{
    right:2px!important;
    border-top-width:9px!important;
    border-bottom-width:9px!important;
    border-right-width:18px!important;
  }
  .spin-btn{
    margin-top:3px!important;
    padding:6px 15px!important;
    font-size:11px!important;
    border-width:1.5px!important;
    box-shadow:0 3px 0 var(--ink)!important;
  }
  .spin-btn:active{
    transform:translateY(2px)!important;
    box-shadow:0 1px 0 var(--ink)!important;
  }
  .wheel-title{font-size:13px!important;margin-bottom:1px!important}
  .wheel-note{font-size:9px!important;margin-bottom:1px!important}
  .progress{margin-top:5px!important;font-size:9px!important}
}
.vessels{display:flex;justify-content:center;gap:8px;margin:7px 0}.vessel{width:clamp(45px,15%,90px);text-align:center;font-size:13px}.vessel svg{display:block;width:100%;height:145px}.volume-note{text-align:center;font-size:11px;margin:4px}.box{font-size:16px!important;min-width:90px}.choice{font-size:14px!important}.answer-row{flex-wrap:wrap}.fixed{width:65px!important}@media(max-height:760px){.vessel svg{height:110px}.vessel{max-width:75px}.vessel svg{width:100%}}
</style>

const QUESTIONS=[{"type": "compare", "text": "Bandingkan volume air dalam wadah A dan B.", "numbers": ["A", "B"], "answer": ["lebih banyak"], "choices": ["lebih banyak", "lebih sedikit", "sama banyak"], "sizes": [4, 2]}, {"type": "compare", "text": "Volume air A … volume air B.", "numbers": ["A", "B"], "answer": ["lebih sedikit"], "choices": ["lebih banyak", "lebih sedikit", "sama banyak"], "sizes": [2, 5]}, {"type": "compare", "text": "Bandingkan volume air kedua wadah.", "numbers": ["A", "B"], "answer": ["sama banyak"], "choices": ["lebih banyak", "lebih sedikit", "sama banyak"], "sizes": [3, 3]}, {"type": "pick", "text": "Wadah mana yang memiliki volume paling besar?", "answer": ["C"], "choices": ["A", "B", "C"], "sizes": [3, 1, 5]}, {"type": "pick", "text": "Wadah mana yang memiliki volume paling kecil?", "answer": ["B"], "choices": ["A", "B", "C"], "sizes": [4, 2, 5]}, {"type": "order", "text": "Urutkan volume air dari paling sedikit ke paling banyak.", "answer": ["A", "C", "B"], "choices": ["A", "B", "C"], "symbol": "<", "sizes": [2, 5, 3]}, {"type": "order", "text": "Urutkan volume air dari paling banyak ke paling sedikit.", "answer": ["C", "A", "B"], "choices": ["A", "B", "C"], "symbol": ">", "sizes": [4, 2, 5]}, {"type": "order", "text": "Urutkan volume air dari paling sedikit ke paling banyak.", "answer": ["C", "B", "A"], "choices": ["A", "B", "C"], "symbol": "<", "sizes": [5, 3, 2]}, {"type": "pick", "text": "Wadah mana yang memiliki volume paling besar?", "answer": ["D"], "choices": ["A", "B", "C", "D"], "sizes": [2, 4, 1, 5]}, {"type": "pick", "text": "Wadah mana yang memiliki volume paling kecil?", "answer": ["E"], "choices": ["A", "B", "C", "D", "E"], "sizes": [3, 5, 2, 4, 1]}];
const COLORS=["#ffcf5c","#83c5ff","#ff91a4","#92dfad","#c6a5ff","#ffad66","#7fd8d0","#f59ac6","#a9c873","#8fb1ff"];
let solved=new Set(),failedAttempt=new Set(),current=null,score=0,rotation=0,boxValues=[],spinning=false;
const wheel=document.getElementById("wheel"),ctx=wheel.getContext("2d"),spin=document.getElementById("spin"),card=document.getElementById("card");
const fmt=value=>typeof value==="number"?value.toLocaleString("id-ID"):value;
document.querySelector(".brand h1").textContent="Membandingkan Volume";
function drawWheel(){
 const cx=360,cy=360,r=330,n=QUESTIONS.length;
 ctx.clearRect(0,0,720,720);
 for(let i=0;i<n;i++){
  let a0=-Math.PI/2+i*2*Math.PI/n,a1=a0+2*Math.PI/n;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,r,a0,a1);ctx.closePath();
  ctx.fillStyle=solved.has(i)?"#ded9e7":COLORS[i];ctx.fill();ctx.strokeStyle="#17121f";ctx.lineWidth=5;ctx.stroke();
  ctx.save();ctx.translate(cx,cy);ctx.rotate((a0+a1)/2);ctx.textAlign="right";ctx.textBaseline="middle";
  ctx.font='700 35px Fredoka, sans-serif';ctx.fillStyle=solved.has(i)?"#91899a":"#352d3b";ctx.fillText("SOAL "+(i+1),r-35,0);ctx.restore();
 }
 ctx.beginPath();ctx.arc(cx,cy,78,0,Math.PI*2);ctx.fillStyle="#17121f";ctx.fill();ctx.strokeStyle="#fff";ctx.lineWidth=8;ctx.stroke();
 ctx.fillStyle="#ffd84d";ctx.font='700 31px Fredoka';ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("PUTAR",cx,cy);
}
function pick(){
 const left=QUESTIONS.map((_,i)=>i).filter(i=>!solved.has(i));
 return left[Math.floor(Math.random()*left.length)];
}
spin.onclick=()=>{
 if(spinning||current!==null||solved.size===QUESTIONS.length)return;
 spinning=true;spin.disabled=true;card.innerHTML='<div class="empty"><div class="big">🎡</div><h2>Roda berputar...</h2><p>Tunggu sampai roda berhenti.</p></div>';
 let idx=pick(),n=QUESTIONS.length,seg=360/n;
 // Pointer di kanan (0°). Pusat segmen target diarahkan ke kanan.
 let target=-(idx*seg+seg/2)+90;
 let base=rotation%360;
 let delta=((target-base)%360+360)%360+1440;
 rotation+=delta;
 wheel.style.transform=`rotate(${rotation}deg)`;
 setTimeout(()=>{spinning=false;spin.disabled=false;current=idx;renderQuestion();},4400);
};
function vessels(q){return '<div class="vessels">'+q.sizes.map((n,i)=>{let h=40+n*16;return '<div class="vessel"><svg viewBox="0 0 90 145" role="img" aria-label="Wadah '+String.fromCharCode(65+i)+' terisi penuh"><path d="M18 '+(130-h)+' L18 130 L72 130 L72 '+(130-h)+'" fill="#71c8ed" stroke="#36819d" stroke-width="3"/><ellipse cx="45" cy="'+(130-h)+'" rx="27" ry="5" fill="#b5e8fa" stroke="#36819d" stroke-width="2"/></svg><b>Wadah '+String.fromCharCode(65+i)+'</b></div>'}).join('')+'</div><p class="volume-note">Semua wadah terisi penuh. Lebar dan skala sama.</p>'}
function renderQuestion(){
 const q=QUESTIONS[current];boxValues=Array(q.answer.length).fill(null);
 let badge=`<span class="badge">Soal ${current+1}</span>`;
 let row="";
 if(q.type==="order"){
  row=q.answer.map((_,i)=>`<div class="box" data-box="${i}">?</div>${i<q.answer.length-1?`<span class="sign">${q.symbol}</span>`:""}`).join("");
 }else if(q.type==="pick"){
  row=`<span>Wadah</span><div class="box" data-box="0">?</div>`;
 }else{
  row=`<div class="fixed">${fmt(q.numbers[0])}</div><div class="box" data-box="0">?</div><div class="fixed">${fmt(q.numbers[1])}</div>`;
 }
 card.innerHTML=`${badge}<div class="qtext">${q.text}</div>${vessels(q)}<div class="answer-row">${row}</div>
 <div class="choices-label">Seret pilihan ke kotak jawaban yang tepat.</div><div class="choices" id="choices"></div>
 <div class="actions"><button class="clear" id="clear">Ulangi</button><button class="check" id="check">Cek Jawaban</button></div><div class="feedback" id="feedback"></div>`;
 const choices=[...q.choices].sort(()=>Math.random()-.5),ce=document.getElementById("choices");
 choices.forEach((v,i)=>{
   let b=document.createElement("button");
   b.className="choice"; b.textContent=fmt(v); b.dataset.value=v;
   ce.appendChild(b);
   makeDraggable(b,q);
 });
 document.querySelectorAll(".box").forEach(b=>{
   b.addEventListener("dragover",e=>{e.preventDefault();b.classList.add("drag-over")});
   b.addEventListener("dragleave",()=>b.classList.remove("drag-over"));
   b.addEventListener("drop",e=>{
     e.preventDefault();b.classList.remove("drag-over");
     const v=e.dataTransfer.getData("text/plain");
     if(v!=="") placeValue(b,v,q);
   });
 });
 document.getElementById("clear").onclick=()=>renderQuestion();
 document.getElementById("check").onclick=check;
}

function placeValue(box,v,q){
 const i=+box.dataset.box;
 boxValues[i]=v;
 box.textContent=fmt(v);
 box.classList.add("filled");
}
function makeDraggable(el,q){
 el.draggable=true;
 el.addEventListener("dragstart",e=>{
   el.classList.add("dragging");
   e.dataTransfer.setData("text/plain",el.dataset.value);
   e.dataTransfer.effectAllowed="copy";
 });
 el.addEventListener("dragend",()=>el.classList.remove("dragging"));

 // Pointer drag agar bekerja juga di layar sentuh/mobile.
 let ghost=null,active=false,startX=0,startY=0;
 el.addEventListener("pointerdown",e=>{
   if(e.pointerType==="mouse") return; // desktop memakai native HTML5 drag
   active=true; startX=e.clientX; startY=e.clientY;
   el.setPointerCapture?.(e.pointerId);
 });
 el.addEventListener("pointermove",e=>{
   if(!active) return;
   if(!ghost && Math.hypot(e.clientX-startX,e.clientY-startY)>6){
     ghost=el.cloneNode(true);
     ghost.style.cssText="position:fixed;z-index:9999;pointer-events:none;opacity:.88;margin:0;box-shadow:0 5px 12px #0003";
     document.body.appendChild(ghost);
     el.classList.add("dragging");
   }
   if(ghost){
     ghost.style.left=(e.clientX-ghost.offsetWidth/2)+"px";
     ghost.style.top=(e.clientY-ghost.offsetHeight/2)+"px";
     document.querySelectorAll(".box").forEach(x=>x.classList.remove("drag-over"));
     const under=document.elementFromPoint(e.clientX,e.clientY);
     const box=under?.closest?.(".box");
     if(box) box.classList.add("drag-over");
   }
 });
 const finish=e=>{
   if(!active)return;
   active=false;
   const under=document.elementFromPoint(e.clientX,e.clientY);
   const box=under?.closest?.(".box");
   if(box && ghost) placeValue(box,el.dataset.value,q);
   document.querySelectorAll(".box").forEach(x=>x.classList.remove("drag-over"));
   el.classList.remove("dragging");
   ghost?.remove(); ghost=null;
 };
 el.addEventListener("pointerup",finish);
 el.addEventListener("pointercancel",e=>{
   active=false; document.querySelectorAll(".box").forEach(x=>x.classList.remove("drag-over"));
   el.classList.remove("dragging"); ghost?.remove(); ghost=null;
 });
}

function check(){
 const q=QUESTIONS[current],fb=document.getElementById("feedback"),boxes=[...document.querySelectorAll(".box")];
 if(boxValues.some(v=>v===null)){fb.className="feedback error";fb.textContent="Isi semua kotak jawaban terlebih dahulu.";return}
 let ok=q.answer.every((v,i)=>String(v)===String(boxValues[i]));
 boxes.forEach((b,i)=>b.classList.add(String(q.answer[i])===String(boxValues[i])?"correct":"wrong"));
 if(ok){
  const dapatPoin=!failedAttempt.has(current);
  fb.className="feedback success";
  fb.textContent=dapatPoin?"Benar! +10 poin.":"Benar! Soal selesai, tetapi tidak mendapat poin karena sebelumnya pernah salah.";
  if(!solved.has(current)){
    solved.add(current);
    if(dapatPoin)score+=10;
    document.getElementById("score").textContent=score;
    document.getElementById("progress").textContent=`${solved.size} dari 10 soal selesai`;
    drawWheel();
  }
  setTimeout(()=>{if(solved.size===QUESTIONS.length)finish();else{current=null;card.innerHTML='<div class="empty"><div class="big">🎡</div><h2>Putar lagi!</h2><p>Dapatkan soal berikutnya dari roda.</p></div>'}},800);
 }else{failedAttempt.add(current);fb.className="feedback error";fb.textContent="Belum tepat. Kamu boleh mencoba lagi, tetapi soal ini tidak akan menambah skor."}
}
function finish(){
 spin.disabled=true;card.innerHTML=`<div class="done-card"><div class="big">🏆</div><h2>Semua Soal Selesai!</h2><p>Skor kamu <b>${score}/100</b>.</p><button class="restart" onclick="location.reload()">Main Lagi</button></div>`;
}
drawWheel();
</script>
</body>
</html>
