<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ular Tangga - Satuan Luas</title>



<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  /* warna seri (sama dengan media Spin the Wheel) */
  --ink:#17121f; --yellow:#ffd84d; --purple:#6c55bd; --green:#48c97f; --red:#ef6b6b;
  --bg:#e2d6f8; --page:#ffffff; --main:#fffaf1; --panel:#ffffff; --text:#332c3a; --muted:#746a7a; --line:#dfd4ee;
  --cellA:#fffbea; --cellB:#ffe8a3; --cellLadder:#cdeecf; --cellSnake:#ffd3d3;
  --num:#6b5a2e; --wood:#b0702c; --woodDark:#7d4a17;
  --token:#ff4f79; --token2:#0f9b8e;
  --right:#24874d; --rightBg:#eafff1; --wrong:#cf4f4f; --wrongBg:#fff0f0;
  --tenA:#ff9f1c; --tenB:#6fa8ff;
  --overlay:rgba(23,18,31,.55);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:"Londrina Solid","Segoe UI",system-ui,sans-serif;font-weight:700;font-size:16px;line-height:1.45;
  display:flex;padding:12px;min-height:100%}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--purple);outline-offset:3px}

/* ===== Bingkai halaman (header, main, footer) ===== */
.page{margin:auto;width:100%;max-width:1180px;background:var(--page);border:2px solid var(--ink);border-radius:22px;overflow:hidden;box-shadow:7px 7px 0 var(--ink)}
header{min-height:72px;background:var(--ink);border-bottom:4px solid var(--yellow);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:42px;height:42px;object-fit:contain;flex:none}
.brand h1{font:600 20px/1.2 "Londrina Solid",sans-serif;margin:0}
.scores{display:flex;gap:8px;flex:none}
.score{background:#fff;color:#55426d;border-radius:14px;padding:7px 15px;text-align:center;font:600 13px/1.2 "Londrina Solid",sans-serif;min-width:64px}
.score b{display:block;font-size:20px;color:#6c55bd}
.score.p1 b{color:#e0325f} .score.p2 b{color:#0f8a7e}
main{background:var(--main);padding:18px;min-height:560px;display:flex;align-items:center;justify-content:center}
footer{height:12px;background:var(--ink);border-top:4px solid var(--yellow)}

.screen{display:none;width:100%}
.screen.show{display:block}

/* ===== Layar awal ===== */
#startScreen.show{display:flex;justify-content:center}
.intro{max-width:560px;width:100%;text-align:center;padding:10px 0}
.intro .big{font-size:64px;line-height:1}
.intro h2{font:600 26px "Londrina Solid",sans-serif;color:var(--purple);margin:8px 0 4px}
.intro .sub{color:var(--muted);font-weight:800;margin:0 0 16px}
.rules{text-align:left;background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px 20px;margin:0 0 20px;box-shadow:0 6px 0 #0000000d}
.rules p{margin:.35em 0}
.modeBtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.bigBtn{border:2px solid var(--ink);border-radius:999px;background:var(--yellow);color:#5b4300;padding:12px 30px;font:700 17px "Londrina Solid",sans-serif;box-shadow:0 5px 0 var(--ink)}
.bigBtn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.bigBtn:disabled{opacity:.55;cursor:not-allowed;transform:none;box-shadow:0 5px 0 var(--ink)}
.bigBtn.alt{background:#6c55bd;color:#fff}

/* ===== Layar permainan ===== */
.game{--bs:min(600px, calc(100vh - 200px));display:grid;grid-template-columns:max(380px, var(--bs)) 290px;gap:20px;justify-content:center;align-items:start}
.boardWrap{background:var(--ink);padding:8px;border-radius:16px;box-shadow:0 6px 0 #0002}
#board{display:block;width:100%;height:auto;border-radius:10px}
#board text{font-family:"Londrina Solid","Londrina Solid",system-ui,sans-serif}
.side{display:flex;flex-direction:column;gap:12px}
.box{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 #0000000d}
#turnTxt{margin:0 0 10px;font:600 17px "Londrina Solid",sans-serif;color:var(--purple);display:flex;align-items:center;gap:8px}
.diceRow{display:flex;align-items:center;gap:14px}
.dice{width:74px;height:74px;background:#fff;border:3px solid var(--ink);border-radius:16px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:8px;flex:none;box-shadow:0 4px 0 var(--ink)}
.dice i{display:block;width:13px;height:13px;border-radius:50%;margin:auto;background:transparent}
.dice i.on{background:#d93b3b}
.dice.rolling{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}100%{transform:rotate(-8deg)}}
#rollBtn{flex:1;padding:12px 10px}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;color:#fff;font:700 14px "Londrina Solid",sans-serif;flex:none;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.prow{display:grid;grid-template-columns:auto 1fr auto auto;grid-template-rows:auto auto;align-items:center;gap:2px 10px;padding:8px 10px;border-radius:12px;border:2px solid transparent}
.prow + .prow{margin-top:6px}
.prow.active{border-color:var(--line);background:var(--main)}
.prow .dot{grid-column:1;grid-row:1 / span 2}
.prow .pname{font:600 16px "Londrina Solid",sans-serif;grid-column:2;grid-row:1}
.prow .ppos{color:var(--muted);font-size:13px;grid-column:2;grid-row:2}
.prow .pscore{font:600 16px "Londrina Solid",sans-serif;grid-row:1 / span 2}
.prow .pscore.good{grid-column:3} .prow .pscore.bad{grid-column:4}
.lbl-s{display:none}
.good{color:var(--right)} .bad{color:var(--wrong)}
.msgBox{background:#f2edff;border-color:#cbbdf0}
#msg{margin:0;min-height:2.9em;color:#4a3a86}
.legend{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid #0002}
.legend .l1::before{background:var(--cellLadder)}
.legend .l2::before{background:var(--cellSnake)}
.iconRow{display:flex;gap:8px}
.iconRow button{flex:1;background:var(--panel);border:2px solid var(--line);color:var(--text);border-radius:12px;padding:8px 6px;font:600 14px "Londrina Solid",sans-serif;box-shadow:0 3px 0 var(--line)}

/* ===== Modal ===== */
.modalBg{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modalBg.show{display:flex}
.modal{background:var(--panel);border-radius:22px;max-width:560px;width:100%;padding:22px;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--ink);max-height:100%;overflow:auto}
.who{display:flex;align-items:center;gap:8px;font:600 16px "Londrina Solid",sans-serif;margin-bottom:8px}
.tag{display:inline-block;font:600 14px "Londrina Solid",sans-serif;padding:6px 13px;border-radius:14px;margin-bottom:12px;color:#fff;background:#6c55bd}
.tag.ladder{background:#2f9e5e} .tag.snake{background:#cf4f4f}
#qText{font-size:clamp(18px,4.6vw,24px);font-weight:900;margin:.1em 0 .7em;line-height:1.4}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts button{background:var(--panel);color:var(--purple);border:2px solid var(--line);border-radius:14px;padding:12px 8px;font:700 26px "Londrina Solid",sans-serif;box-shadow:0 4px 0 var(--line)}
.opts button:hover:not(:disabled){border-color:var(--purple)}
.opts button:disabled{cursor:default}
.opts button.right{background:var(--rightBg);border-color:var(--green);color:var(--right)}
.opts button.wrong{background:var(--wrongBg);border-color:var(--red);color:var(--wrong)}
.hintBtn{background:transparent;border:0;color:var(--purple);font:600 15px "Londrina Solid",sans-serif;padding:12px 0 0}
#hint{display:none;margin-top:8px;padding:12px;border:2px dashed var(--line);border-radius:14px;font-size:14px}
#hint.show{display:block}
#hint p{margin:.2em 0}
.rods{display:flex;align-items:flex-end;flex-wrap:wrap;gap:4px;margin-top:8px}
.rod{width:12px;height:60px;border-radius:3px;background:repeating-linear-gradient(to top,var(--c) 0 5px,rgba(255,255,255,.55) 5px 6px)}
.units{display:grid;grid-template-columns:repeat(3,10px);gap:2px;align-self:flex-end;margin-left:4px}
.unit{width:10px;height:10px;border-radius:2px;background:var(--c)}
.rods .plus{font:700 24px "Londrina Solid",sans-serif;margin:0 10px;align-self:center}
#feedback{display:none;margin-top:14px;padding:12px 14px;border-radius:14px;font-size:15px}
#feedback.show{display:block}
#feedback.ok{background:var(--rightBg);color:var(--right)}
#feedback.no{background:var(--wrongBg);color:var(--wrong)}
#feedback p{margin:.2em 0}
#feedback .explain{color:var(--text);font-weight:800}
#nextBtn{display:none;margin-top:14px;width:100%}
#nextBtn.show{display:block}
.winCard{text-align:center}
.winCard .big{font-size:60px;line-height:1}
.winCard h2{font:600 26px "Londrina Solid",sans-serif;color:var(--purple);margin:.2em 0}
.winCard p{margin:.3em 0;display:flex;align-items:center;justify-content:center;gap:6px}
.winCard .modeBtns{margin-top:18px}

/* ===== Tablet ===== */
@media (max-width:960px){
  main{padding:16px;min-height:0}
  .game{grid-template-columns:minmax(0,620px);justify-content:center}
  .side{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .side .wide{grid-column:1 / -1}
}
/* ===== HP ===== */
@media (max-width:560px){
  body{padding:5px}
  .page{margin:0 auto auto}
  .page{border-radius:16px;box-shadow:4px 4px 0 var(--ink)}
  header{min-height:58px;padding:8px 12px}
  .brand h1{font-size:15px}
  .brand img{width:34px;height:34px}
  .score{padding:5px 9px;font-size:11px;min-width:0;border-radius:11px}
  .score b{font-size:16px}
  .lbl-l{display:none} .lbl-s{display:inline}
  main{padding:8px}
  .boardWrap{padding:5px;border-radius:12px}
  .side{grid-template-columns:1fr;gap:8px}
  .box{padding:10px 12px;border-radius:14px}
  .legend{display:none}
  .dice{width:58px;height:58px;padding:6px;border-radius:12px}
  .dice i{width:10px;height:10px}
  #turnTxt{font-size:15px;margin-bottom:8px}
  .bigBtn{padding:10px 20px;font-size:15px}
  #msg{min-height:0}
  .intro h2{font-size:21px}
  .intro .big{font-size:48px}
  .modal{padding:16px;box-shadow:4px 4px 0 var(--ink)}
  .opts button{font-size:22px;padding:10px 6px}
}
@media (max-width:360px){
  .brand h1{font-size:13px}
  .scores{gap:4px}
}
@media (prefers-reduced-motion: reduce){ .dice.rolling{animation:none} }
</style>

      [['var(--woodDark)',12],['var(--wood)',8]].forEach(function(st){

    $('hint').className = '';
    $('hint').innerHTML = '<p>' + currentQ.hint + '</p>';
    $('hintBtn').style.display = '';
    $('feedback').className = ''; $('feedback').innerHTML = '';
    $('nextBtn').className = 'bigBtn';
    $('qModal').classList.add('show');
    setTimeout(function(){ box.firstChild.focus(); }, 50);
  }

  function answer(val, btn){
    var buttons = $('opts').children, p = cur();
    for(var i=0; i<buttons.length; i++){
      buttons[i].disabled = true;
      if(+buttons[i].dataset.value === currentQ.c) buttons[i].classList.add('right');
    }
    lastCorrect = (val === currentQ.c);
    var fb = $('feedback');
    if(lastCorrect){
      p.right++; play(SOUND_OK); btn.classList.add('right');
      fb.className = 'show ok';
      fb.innerHTML = '<p><b>Benar!</b> ' + (currentKind === 'ladder' ? 'Ayo naik tangga.' : 'Aman dari ular.') + '</p>';
    } else {
      p.wrong++; play(SOUND_NO); btn.classList.add('wrong');
      fb.className = 'show no';
      fb.innerHTML = '<p><b>Belum tepat.</b> Jawabannya ' + fmt(currentQ.c) + ' ' + currentQ.unit + '. ' + (currentKind === 'ladder' ? 'Tetap di kotak ini.' : 'Ular menggigit, turun ke ekornya.') + '</p>';
    }
    fb.innerHTML += '<p class="explain">' + explain(currentQ) + '</p>';
    $('hintBtn').style.display = 'none';
    $('nextBtn').disabled=false; $('nextBtn').className = 'bigBtn show';
    $('nextBtn').focus();
    render();
  }

  async function afterQuestion(){
    if($('nextBtn').disabled)return; $('nextBtn').disabled=true;
    var p = cur();
    $('qModal').classList.remove('show');
    await sleep(200);
    if(currentKind === 'ladder' && lastCorrect){
      tone([330,440,550,660],.13); p.pos = LADDERS[p.pos];
      await moveToCell(turn, p.pos, 900);
      say(pname(turn) + ' naik tangga ke kotak ' + p.pos + '!');
    } else if(currentKind === 'snake' && !lastCorrect){
      tone([550,440,330,220],.15); var pts = snakePaths[p.pos];
      for(var i=0; i<pts.length; i+=3) await moveToken(turn, pts[i].x, pts[i].y, 45);
      p.pos = SNAKES[p.pos];
      await moveToCell(turn, p.pos, 150);
      say(pname(turn) + ' turun ke kotak ' + p.pos + '.');
    }
    render();
    if(p.pos === 100){ win(turn); return; }
    await sleep(700);
    endTurn();
  }

  function win(i){
    $('winTitle').textContent = numPlayers === 1 ? 'Kamu sampai di 100!' : 'Pemain ' + (i+1) + ' menang!';
    var h = '';
    players.forEach(function(p, k){
      var total = p.right + p.wrong;
      h += '<p>' + (numPlayers > 1 ? dotHTML(k) + ' ' : '') + pname(k) + ': ' +
        (total ? 'benar ' + p.right + ' dari ' + total + ' soal' : 'belum menjawab soal') + '</p>';
    });
    $('winScore').innerHTML = h;
    tone([523,659,784,1047,784,1047],.18); celebrate();
    $('winModal').classList.add('show');
    $('againBtn').focus();
  }

  function reset(){
    players = [];
    for(var i=0; i<numPlayers; i++) players.push({pos:1, right:0, wrong:0});
    turn = 0; used = {};
    for(var t=0;t<4;t++) $('token'+t).style.display = t<numPlayers ? '' : 'none';
    players.forEach(function(p, i){ moveToCell(i, 1, 0); });
    showFace(1);
    say(numPlayers > 1 ? 'Pemain 1 mulai duluan. Tekan “Lempar dadu”.' : 'Tekan “Lempar dadu” untuk mulai.');
    $('winModal').classList.remove('show');
    $('qModal').classList.remove('show');
    render();
    setBusy(false);
  }
  function fitGameBoard(){
    if(window.innerWidth<=600)return;
    var layout=document.querySelector('.game'),wrap=document.querySelector('.boardWrap');
    if(!layout||!wrap||!layout.clientHeight)return;
    var side=document.querySelector('.side'),gap=parseFloat(getComputedStyle(layout).columnGap)||20;
    var availableWidth=layout.clientWidth-side.getBoundingClientRect().width-gap;
    var size=Math.max(0,Math.floor(Math.min(availableWidth,layout.clientHeight)));
    wrap.style.setProperty('--board-size',size+'px');
  }
  window.addEventListener('resize',fitGameBoard);
  if(window.ResizeObserver)new ResizeObserver(fitGameBoard).observe(document.querySelector('main'));
  function startGame(n){
    numPlayers = n; document.querySelector('.page').classList.remove('cover-mode'); if(window.speechSynthesis)speechSynthesis.cancel();
    $('startScreen').classList.remove('show');
    $('gameScreen').classList.add('show');
    requestAnimationFrame(fitGameBoard);
    reset();
    $('rollBtn').focus();
  }
  function toMenu(){
    document.querySelector('.page').classList.add('cover-mode');
    $('hdrScores').innerHTML = '';
    $('winModal').classList.remove('show');
    $('gameScreen').classList.remove('show');
    $('startScreen').classList.add('show');
  }

var audioContext;
  function tone(notes,duration){if(!soundOn)return;try{audioContext=audioContext||new(window.AudioContext||window.webkitAudioContext)();audioContext.resume();notes.forEach(function(f,i){var o=audioContext.createOscillator(),g=audioContext.createGain(),t=audioContext.currentTime+.03+i*duration;o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.09,t);g.gain.exponentialRampToValueAtTime(.001,t+duration);o.connect(g);g.connect(audioContext.destination);o.start(t);o.stop(t+duration);});}catch(e){}}
  function celebrate(){for(var i=0;i<70;i++){var c=document.createElement('i');c.className='confetti';c.style.background=['#ffd84d','#48c97f','#6c55bd','#ef6b6b'][i%4];c.style.left=Math.random()*100+'vw';c.style.top='-12px';document.body.appendChild(c);var a=c.animate([{transform:'translateY(0) rotate(0)'},{transform:'translateY(105vh) rotate(600deg)'}],{duration:1800+Math.random()*1300,delay:Math.random()*400});a.onfinish=function(){this.effect.target.remove();};}}
  setTimeout(function(){if(!document.querySelector('.page').classList.contains('cover-mode')||!window.speechSynthesis)return;var u=new SpeechSynthesisUtterance('Ular Tangga Satuan Luas. Tekan tombol Lempar dadu untuk bermain. Jawab soal dengan benar agar menang.');u.lang='id-ID';u.rate=.85;speechSynthesis.speak(u);},300);

  // ====== Mulai ======
  document.querySelector('.brand h1').textContent = 'Ular Tangga Satuan Luas';
  drawBoard();
  $('start1').addEventListener('click', function(){ startGame(1); });
  $('start2').addEventListener('click', function(){ startGame(2); });
  $('start3').addEventListener('click', function(){ startGame(3); });
  $('start4').addEventListener('click', function(){ startGame(4); });
  $('rollBtn').addEventListener('click', roll);
  $('nextBtn').addEventListener('click', afterQuestion);
  $('hintBtn').addEventListener('click', function(){ $('hint').classList.toggle('show'); });
  $('againBtn').addEventListener('click', reset);
  $('winMenuBtn').addEventListener('click', toMenu);
  $('restartBtn').addEventListener('click', function(){ if(!busy || $('winModal').classList.contains('show')) reset(); });
  $('menuBtn').addEventListener('click', function(){ if(!busy || $('winModal').classList.contains('show')) toMenu(); });
  $('soundBtn').addEventListener('click', function(){
    soundOn = !soundOn;
    this.textContent = soundOn ? '🔊 Suara' : '🔇 Suara';
    this.setAttribute('aria-pressed', soundOn);
  });
})();
</script>
</body>
</html>
